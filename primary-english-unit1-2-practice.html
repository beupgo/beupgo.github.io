<!DOCTYPE html>
<html lang="zh-CN" data-theme="">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>六年级上册 Unit 1-2 · 必考精练</title>
<style>
/* ============ Design tokens (genius-design derived) ============ */
:root{
  /* brand hue system */
  --brand-h: 231;
  --brand-s: 84%;
  --brand-l: 58%;
  --s-brand: hsl(var(--brand-h) var(--brand-s) var(--brand-l));
  --s-brand-weak: hsl(var(--brand-h) var(--brand-s) 96%);
  --s-brand-strong: hsl(var(--brand-h) var(--brand-s) 46%);
  --s-brand-fg: #ffffff;

  /* semantic accent hues */
  --cyan:   #0891b2;   --cyan-weak:#ecfeff;
  --amber:  #b45309;   --amber-weak:#fffbeb;
  --green:  #15803d;   --green-weak:#f0fdf4;
  --rose:   #be123c;   --rose-weak:#fff1f2;

  /* surfaces */
  --s-bg: #f5f6f8;
  --s-surface: #ffffff;
  --s-surface-2: #f1f3f6;
  --s-line: #e4e7ec;
  --s-line-strong:#d0d5dd;

  /* text */
  --s-fg: #1f2430;
  --s-fg-2: #4a5261;
  --s-fg-3: #7b8494;

  /* status */
  --ok: #16a34a;   --ok-weak:#dcfce7;
  --no: #dc2626;   --no-weak:#fee2e2;
  --mid:#d97706;   --mid-weak:#fef3c7;

  /* spacing scale */
  --g-sp-1: 4px;  --g-sp-2: 8px;  --g-sp-3: 12px; --g-sp-4: 16px;
  --g-sp-5: 20px; --g-sp-6: 24px; --g-sp-8: 32px; --g-sp-10: 40px;

  /* radius */
  --g-r-1: 6px; --g-r-2: 10px; --g-r-3: 14px; --g-r-4: 20px; --g-r-pill: 999px;

  /* elevation */
  --g-sh-1: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --g-sh-2: 0 4px 12px rgba(16,24,40,.08), 0 2px 6px rgba(16,24,40,.06);
  --g-sh-3: 0 12px 32px rgba(16,24,40,.14);

  /* container widths */
  --c-container-max: 1080px;
  --c-container-wide: 1280px;
  --c-container-read: 720px;

  /* type */
  --g-font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --g-mono: "SF Mono", ui-monospace, "Roboto Mono", Menlo, Consolas, monospace;
}

/* dark mode */
:root[data-theme="dark"]{
  --s-brand-weak: hsl(var(--brand-h) 40% 22%);
  --cyan-weak:#0b2e33; --amber-weak:#3a2708; --green-weak:#0c2d18; --rose-weak:#3a1017;
  --s-bg: #0f1218;
  --s-surface: #171b23;
  --s-surface-2: #1e242e;
  --s-line: #2a313c;
  --s-line-strong:#3a424e;
  --s-fg: #eaedf2;
  --s-fg-2: #b7c0cd;
  --s-fg-3: #8a94a3;
  --ok-weak:#0d2a17; --no-weak:#341113; --mid-weak:#3a2a07;
}

/* ============ icon utility ============ */
.ic{
  width:1.15em; height:1.15em;
  display:inline-block; vertical-align:-0.18em;
  fill:none; stroke:currentColor; stroke-width:2;
  stroke-linecap:round; stroke-linejoin:round;
  flex:0 0 auto;
}

/* ============ layout kit ============ */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  font-family:var(--g-font);
  color:var(--s-fg);
  background:var(--s-bg);
  line-height:1.6;
  -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
}
.wrap{
  max-width:var(--c-container-max);
  margin:0 auto;
  padding:var(--g-sp-5) var(--g-sp-4) var(--g-sp-10);
}
h1,h2,h3,h4{ margin:0; font-weight:700; }
p{ margin:0 0 var(--g-sp-3); }
button{ font-family:inherit; cursor:pointer; }
small{ font-weight:400; }
table{ border-collapse:collapse; width:100%; }

/* ============ app.css — Unit 1-2 练习页 (tokens only) ============ */

/* ---------- appbar ---------- */
.appbar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between; gap:var(--g-sp-3);
  padding:var(--g-sp-3) var(--g-sp-4);
  background:color-mix(in srgb, var(--s-surface) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--s-line);
}
.appbar__title{ display:flex; align-items:center; gap:var(--g-sp-3); min-width:0; }
.brandmark{
  display:grid; place-items:center; width:40px; height:40px; flex:0 0 auto;
  border-radius:var(--g-r-2); color:var(--s-brand-fg);
  background:linear-gradient(135deg, var(--s-brand), var(--s-brand-strong));
  font-size:20px; box-shadow:var(--g-sh-1);
}
.appbar .ttl{ font-size:16px; font-weight:800; line-height:1.25; }
.appbar .sub{ font-size:11.5px; color:var(--s-fg-3); line-height:1.3;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:52vw; }
.appbar__tools{ display:flex; align-items:center; gap:var(--g-sp-2); flex:0 0 auto; }
.rate-seg{ display:inline-flex; background:var(--s-surface-2); border:1px solid var(--s-line);
  border-radius:var(--g-r-pill); padding:2px; }
.rate-opt{ border:none; background:transparent; color:var(--s-fg-2);
  font-size:12px; padding:4px 10px; border-radius:var(--g-r-pill); }
.rate-opt--on{ background:var(--s-brand); color:var(--s-brand-fg); font-weight:700; }
.icon-btn{ display:grid; place-items:center; width:36px; height:36px; font-size:18px;
  border:1px solid var(--s-line); background:var(--s-surface); color:var(--s-fg-2);
  border-radius:var(--g-r-2); }
.icon-btn:hover{ border-color:var(--s-line-strong); color:var(--s-fg); }

/* ---------- tabbar ---------- */
.tabbar{
  position:sticky; top:57px; z-index:19;
  display:flex; gap:var(--g-sp-1); overflow-x:auto;
  padding:var(--g-sp-2) var(--g-sp-4);
  background:var(--s-surface); border-bottom:1px solid var(--s-line);
}
.tab{ position:relative; display:inline-flex; align-items:center; gap:6px;
  border:none; background:transparent; color:var(--s-fg-2);
  font-size:13.5px; font-weight:600; padding:8px 14px; border-radius:var(--g-r-pill);
  white-space:nowrap; }
.tab .ic{ font-size:16px; }
.tab--on{ background:var(--s-brand-weak); color:var(--s-brand-strong); }
.tab-badge{ font-style:normal; font-size:10.5px; font-weight:700; min-width:17px;
  height:17px; padding:0 4px; display:inline-grid; place-items:center;
  background:var(--no); color:#fff; border-radius:var(--g-r-pill); }

/* ---------- cards ---------- */
.card{ background:var(--s-surface); border:1px solid var(--s-line);
  border-radius:var(--g-r-3); box-shadow:var(--g-sh-1);
  padding:var(--g-sp-4) var(--g-sp-5); margin-bottom:var(--g-sp-5); }
.card.center{ text-align:center; }
.card__hd{ display:flex; align-items:center; gap:var(--g-sp-2);
  margin:calc(-1*var(--g-sp-1)) 0 var(--g-sp-4); }
.card__hd .ic{ font-size:20px; color:var(--s-brand); flex:0 0 auto; }
.card__hd h2{ font-size:16px; display:flex; align-items:baseline; gap:8px; flex:1; }
.card__hd h2 small{ font-size:11.5px; color:var(--s-fg-3); font-weight:500; }
.card__hd .btn{ margin-left:auto; }
.hd--cyan .ic{ color:var(--cyan); } .hd--amber .ic{ color:var(--amber); }
.hd--green .ic{ color:var(--green); } .hd--brand .ic{ color:var(--s-brand); }

/* ---------- legend ---------- */
.legend{ background:var(--s-brand-weak); border:1px solid var(--s-line);
  border-radius:var(--g-r-2); padding:var(--g-sp-3) var(--g-sp-4); margin-bottom:var(--g-sp-5); }
.legend__t{ font-size:13px; color:var(--s-fg-2); }
.legend__t .ic{ color:var(--s-brand); }
.legend__items{ display:flex; flex-wrap:wrap; gap:var(--g-sp-2); margin-top:var(--g-sp-2); }
.lg{ font-size:12px; font-weight:700; padding:3px 10px; border-radius:var(--g-r-pill); }
.lg--subj{ background:#e0e7ff; color:#3730a3; }
.lg--verb{ background:#dcfce7; color:#166534; }
.lg--obj{  background:#fef3c7; color:#92400e; }
.lg--other{background:#e0f2fe; color:#075985; }
.lg--conj{ background:#fae8ff; color:#86198f; }
:root[data-theme="dark"] .lg--subj{ background:#312e81; color:#c7d2fe; }
:root[data-theme="dark"] .lg--verb{ background:#14532d; color:#bbf7d0; }
:root[data-theme="dark"] .lg--obj{ background:#78350f; color:#fde68a; }
:root[data-theme="dark"] .lg--other{ background:#075985; color:#bae6fd; }
:root[data-theme="dark"] .lg--conj{ background:#701a75; color:#f5d0fe; }

/* ---------- word grid / cards ---------- */
.wordgrid{ display:grid; gap:var(--g-sp-3);
  grid-template-columns:repeat(auto-fill, minmax(238px, 1fr)); }
.wcard{ border:1px solid var(--s-line); border-radius:var(--g-r-2);
  padding:var(--g-sp-3); background:var(--s-surface-2); display:flex; flex-direction:column; gap:4px; }
.wcard__top{ display:flex; align-items:center; gap:6px; }
.wen{ font-size:17px; font-weight:800; flex:1; }
.wipa{ font-family:var(--g-mono); font-size:12.5px; color:var(--s-brand-strong); }
.wzh{ font-size:13px; color:var(--s-fg-2); }
.wex{ margin-top:6px; padding-top:6px; border-top:1px dashed var(--s-line-strong); }
.wex__ipa{ font-family:var(--g-mono); font-size:11.5px; color:var(--s-fg-3);
  display:flex; align-items:center; gap:6px; margin-top:3px; flex-wrap:wrap; }
.wex__zh{ font-size:12px; color:var(--s-fg-3); margin-top:2px; }

.play{ display:inline-grid; place-items:center; width:26px; height:26px; flex:0 0 auto;
  border:1px solid var(--s-line); background:var(--s-surface); color:var(--s-brand);
  border-radius:var(--g-r-pill); font-size:13px; }
.play:hover{ background:var(--s-brand-weak); }
.play.playing{ background:var(--s-brand); color:var(--s-brand-fg);
  animation:pulse 1s ease-in-out infinite; }
@keyframes pulse{ 50%{ opacity:.55; } }
.collect{ display:inline-grid; place-items:center; width:26px; height:26px; flex:0 0 auto;
  border:1px solid var(--s-line); background:var(--s-surface); color:var(--s-fg-3);
  border-radius:var(--g-r-pill); font-size:13px; }
.collect--on{ color:#f59e0b; border-color:#fcd34d; background:#fffbeb; }
:root[data-theme="dark"] .collect--on{ background:#3a2708; }
.collect--on .ic{ fill:#f59e0b; }

/* ---------- annotation ---------- */
.sent-underline{ display:inline; line-height:2.4; font-size:15px; }
.tk-u{ display:inline-flex; flex-direction:column; align-items:center;
  margin:0 1px; vertical-align:bottom; }
.tk-u__word{ padding:0 2px; border-bottom:2.5px solid transparent; }
.tk-u__tag{ font-size:9px; line-height:1.1; margin-top:1px; font-weight:700; opacity:.9; }
.tk-u--subj  .tk-u__word{ border-color:#6366f1; } .tk-u--subj  .tk-u__tag{ color:#4f46e5; }
.tk-u--verb  .tk-u__word{ border-color:#22c55e; } .tk-u--verb  .tk-u__tag{ color:#16a34a; }
.tk-u--obj   .tk-u__word{ border-color:#f59e0b; } .tk-u--obj   .tk-u__tag{ color:#d97706; }
.tk-u--other .tk-u__word{ border-color:#0ea5e9; } .tk-u--other .tk-u__tag{ color:#0284c7; }
.tk-u--conj  .tk-u__word{ border-color:#d946ef; } .tk-u--conj  .tk-u__tag{ color:#c026d3; }

/* ---------- phrases ---------- */
.phrasegrid{ display:grid; gap:var(--g-sp-3);
  grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); }
.pcard{ border:1px solid var(--s-line); border-radius:var(--g-r-2);
  padding:var(--g-sp-3); background:var(--s-surface-2); }
.pcard__en{ font-size:15px; font-weight:700; display:flex; align-items:center; gap:6px; }
.pcard__ipa{ font-family:var(--g-mono); font-size:11.5px; color:var(--s-brand-strong); margin-top:2px; }
.pcard__zh{ font-size:12.5px; color:var(--s-fg-2); margin-top:2px; }

/* ---------- patterns ---------- */
.pat-group{ margin-bottom:var(--g-sp-4); }
.pat-group__name{ font-size:13.5px; font-weight:800; padding:5px 12px; border-radius:var(--g-r-pill);
  display:inline-block; margin-bottom:var(--g-sp-2); background:var(--s-surface-2); }
.pgn--cyan{ background:var(--cyan-weak); color:var(--cyan); }
.pgn--amber{ background:var(--amber-weak); color:var(--amber); }
.pgn--green{ background:var(--green-weak); color:var(--green); }
.pgn--brand{ background:var(--s-brand-weak); color:var(--s-brand-strong); }
.pat{ border:1px solid var(--s-line); border-left:none; border-radius:var(--g-r-2);
  padding:var(--g-sp-3); margin-bottom:var(--g-sp-2); background:var(--s-surface); }
.pat__tpl{ font-size:14px; display:flex; align-items:center; gap:6px; }
.pat__tpl .ic{ color:var(--s-brand); }
.pat__use{ font-size:12.5px; color:var(--s-fg-3); margin:3px 0 8px; }
.pat__ex{ padding:8px 10px; border-radius:var(--g-r-1); background:var(--s-surface-2);
  margin-top:6px; }

/* ---------- grammar ---------- */
.gram{ display:grid; gap:var(--g-sp-4); grid-template-columns:1fr; }
@media(min-width:760px){ .gram{ grid-template-columns:1.4fr 1fr; } }
.gram__sub{ font-size:13px; font-weight:700; color:var(--s-fg-2); margin-bottom:6px; }
.gtable td{ padding:7px 8px; border-bottom:1px solid var(--s-line); vertical-align:top; font-size:13px; }
.grule{ color:var(--s-fg-2); width:44%; }
.gex{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{ display:inline-flex; align-items:center; gap:5px; font-size:12.5px;
  padding:3px 9px; border-radius:var(--g-r-pill); background:var(--s-brand-weak);
  color:var(--s-fg); }
.chip b{ color:var(--s-brand-strong); }
.chip--warn{ background:var(--amber-weak); }
.chip--warn b{ color:var(--amber); }
.irr{ display:flex; flex-wrap:wrap; gap:6px; }

/* ---------- good sentences ---------- */
.good .pat__ex{ background:var(--cyan-weak); }

/* ---------- buttons ---------- */
.btn{ display:inline-flex; align-items:center; gap:6px; justify-content:center;
  border:1px solid var(--s-line-strong); background:var(--s-surface); color:var(--s-fg);
  font-size:13.5px; font-weight:600; padding:9px 16px; border-radius:var(--g-r-2); }
.btn:hover{ background:var(--s-surface-2); }
.btn.sm{ font-size:12px; padding:6px 11px; }
.btn--primary{ background:var(--s-brand); color:var(--s-brand-fg); border-color:transparent; }
.btn--primary:hover{ background:var(--s-brand-strong); color:var(--s-brand-fg); }
.btn--ghost{ background:transparent; border-color:var(--s-line); color:var(--s-fg-2); }
.btn--ghost:hover{ background:var(--s-surface-2); color:var(--s-fg); }
.btn[disabled]{ opacity:.4; cursor:not-allowed; }
.btnrow{ display:flex; flex-wrap:wrap; gap:var(--g-sp-2); justify-content:center; margin:var(--g-sp-3) 0; }

.big{ font-size:20px; display:flex; align-items:center; justify-content:center; gap:8px; }
.muted{ color:var(--s-fg-2); font-size:13.5px; }
.warn{ color:var(--no); font-weight:600; }
.ok{ color:var(--ok); font-weight:700; }
.qtypes{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:var(--g-sp-3); }

/* ---------- quiz ---------- */
.quiz-hd{ margin-bottom:var(--g-sp-3); }
.progress{ height:7px; border-radius:var(--g-r-pill); background:var(--s-surface-2); overflow:hidden; }
.progress span{ display:block; height:100%; background:var(--s-brand); transition:width .3s; }
.quiz-meta{ display:flex; justify-content:space-between; align-items:center; gap:10px;
  font-size:12.5px; color:var(--s-fg-3); margin-top:6px; }
.combo{ color:var(--amber); font-weight:700; }
.qtype{ display:inline-block; font-size:11.5px; font-weight:700; color:var(--s-brand-strong);
  background:var(--s-brand-weak); padding:3px 10px; border-radius:var(--g-r-pill); margin-bottom:8px; }
.qstem{ font-size:17px; font-weight:600; line-height:1.7; }
.qzh{ font-size:13px; color:var(--s-fg-3); margin-top:4px; }
.qplay{ margin-top:8px; }
.stem-clz .blank{ display:inline-block; min-width:66px; border-bottom:2.5px solid var(--s-brand);
  margin:0 4px; vertical-align:baseline; height:1.1em; }
.opts{ display:grid; gap:var(--g-sp-2); margin-top:var(--g-sp-3); }
@media(min-width:560px){ .opts{ grid-template-columns:1fr 1fr; } }
.opt{ text-align:left; border:1.5px solid var(--s-line); background:var(--s-surface);
  color:var(--s-fg); font-size:15px; font-weight:600; padding:12px 14px; border-radius:var(--g-r-2);
  transition:border-color .15s, background .15s; }
.opt:hover{ border-color:var(--s-brand); }
.opt--sel{ border-color:var(--s-brand); background:var(--s-brand-weak); }
.opt--right{ border-color:var(--ok); background:var(--ok-weak); color:var(--ok); }
.opt--wrong{ border-color:var(--no); background:var(--no-weak); color:var(--no); }
.reveal{ margin-top:var(--g-sp-3); padding:var(--g-sp-3); border-radius:var(--g-r-2);
  border:1px solid var(--s-line); }
.reveal--ok{ background:var(--ok-weak); border-color:var(--ok); }
.reveal--no{ background:var(--no-weak); border-color:var(--no); }
.reveal__hd{ font-weight:700; font-size:14px; display:flex; align-items:center; gap:6px; }
.reveal--ok .reveal__hd{ color:var(--ok); } .reveal--no .reveal__hd{ color:var(--no); }
.reveal__sent{ margin-top:8px; padding-top:8px; border-top:1px dashed var(--s-line-strong); }
.scorebig{ font-size:38px; font-weight:800; color:var(--s-brand); margin:var(--g-sp-3) 0; }
.scorebig small{ font-size:18px; color:var(--s-fg-3); }

/* ---------- 错题本 ---------- */
.miss-list{ display:grid; gap:var(--g-sp-2); margin-top:var(--g-sp-3); }
.miss{ display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center;
  padding:10px 12px; border:1px solid var(--s-line); border-radius:var(--g-r-2);
  background:var(--s-surface-2); font-size:13px; }
.miss__w{ font-weight:800; color:var(--amber); }
.miss__q{ color:var(--s-fg-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.miss__a{ color:var(--ok); font-weight:600; display:flex; align-items:center; gap:6px; white-space:nowrap; }
.empty{ text-align:center; color:var(--s-fg-3); padding:var(--g-sp-8) 0; }
.empty .ic{ font-size:36px; color:var(--s-line-strong); }

/* ---------- 收藏本 ---------- */
.fav-stat{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--g-sp-2); margin-bottom:var(--g-sp-3); }
.fs{ text-align:center; padding:var(--g-sp-3); border:1px solid var(--s-line);
  border-radius:var(--g-r-2); background:var(--s-surface-2); }
.fs b{ display:block; font-size:24px; font-weight:800; color:var(--s-brand); }
.fs span{ font-size:12px; color:var(--s-fg-3); }
.fs--due b{ color:var(--amber); }
.fav-list{ display:grid; gap:var(--g-sp-2); }
.fav{ display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:10px 12px; border:1px solid var(--s-line); border-radius:var(--g-r-2); background:var(--s-surface-2); }
.fav__l{ display:flex; align-items:center; gap:8px; min-width:0; }
.fav__w{ font-weight:800; font-size:15px; }
.fav__zh{ font-size:12px; color:var(--s-fg-3); }
.fav__r{ display:flex; align-items:center; gap:8px; flex:0 0 auto; }
.fav__due{ font-size:11.5px; color:var(--s-fg-3); padding:2px 8px; border-radius:var(--g-r-pill); background:var(--s-surface); }
.fav__due.due-now{ background:var(--amber-weak); color:var(--amber); font-weight:700; }
.fav__lv{ font-size:11px; color:var(--s-fg-3); }

/* ---------- exam ---------- */
.exam-q{ font-size:17px; font-weight:600; line-height:1.8; display:flex; gap:6px; }
.exam-no{ font-weight:800; color:var(--s-brand); }
.exam-nav{ display:flex; gap:var(--g-sp-2); justify-content:space-between; margin-top:var(--g-sp-4); flex-wrap:wrap; }
.exam-nav .btn--primary{ margin-left:auto; }
.sheet{ margin-top:var(--g-sp-4); padding-top:var(--g-sp-3); border-top:1px dashed var(--s-line-strong); }
.sheet__t{ font-size:12.5px; font-weight:700; color:var(--s-fg-2); margin-bottom:8px; }
.sheet__grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(38px,1fr)); gap:6px; }
.cell{ height:36px; border:1px solid var(--s-line); border-radius:var(--g-r-1);
  background:var(--s-surface); color:var(--s-fg-2); font-weight:700; font-size:13px; }
.cell--done{ background:var(--s-brand-weak); color:var(--s-brand-strong); border-color:var(--s-brand); }
.cell--cur{ outline:2px solid var(--s-brand); outline-offset:1px; }

.result-score{ text-align:center; margin:var(--g-sp-3) 0; }
.rs__num{ font-size:44px; font-weight:800; color:var(--s-brand); }
.rs__num small{ font-size:20px; color:var(--s-fg-3); }
.rs__lv{ display:inline-block; font-weight:700; font-size:14px; padding:4px 14px;
  border-radius:var(--g-r-pill); background:var(--s-brand-weak); color:var(--s-brand-strong); margin-top:6px; }
.rs--优秀{ background:var(--ok-weak); color:var(--ok); }
.rs--及格{ background:var(--mid-weak); color:var(--mid); }
.rs--待提升{ background:var(--no-weak); color:var(--no); }
.tally{ display:grid; grid-template-columns:repeat(4,1fr); gap:var(--g-sp-2); margin:var(--g-sp-4) 0; }
.ty{ text-align:center; padding:var(--g-sp-3); border:1px solid var(--s-line);
  border-radius:var(--g-r-2); background:var(--s-surface-2); }
.ty b{ display:block; font-size:24px; font-weight:800; }
.ty span{ font-size:11.5px; color:var(--s-fg-3); }
.ty--ok b{ color:var(--ok); } .ty--no b{ color:var(--no); } .ty--un b{ color:var(--mid); }
.sec-sub{ font-size:14px; font-weight:800; margin:var(--g-sp-4) 0 var(--g-sp-2); display:flex; align-items:center; gap:6px; }
.board-mastery{ display:grid; gap:var(--g-sp-2); }
.bm{ display:grid; grid-template-columns:70px 1fr auto auto; gap:10px; align-items:center; font-size:13px; }
.bm__name{ font-weight:700; }
.bm__bar{ height:9px; border-radius:var(--g-r-pill); background:var(--s-surface-2); overflow:hidden; }
.bm__bar i{ display:block; height:100%; }
.bar--ok{ background:var(--ok); } .bar--mid{ background:var(--mid); } .bar--no{ background:var(--no); }
.bm__num{ color:var(--s-fg-3); font-size:12px; }
.bm__tag{ font-size:11px; font-weight:700; padding:2px 8px; border-radius:var(--g-r-pill); }
.tag--ok{ background:var(--ok-weak); color:var(--ok); }
.tag--mid{ background:var(--mid-weak); color:var(--mid); }
.tag--no{ background:var(--no-weak); color:var(--no); }
.advice{ background:var(--s-surface-2); border:1px solid var(--s-line);
  border-radius:var(--g-r-2); padding:var(--g-sp-3) var(--g-sp-4); margin-top:var(--g-sp-3); }
.advice p{ font-size:13px; color:var(--s-fg-2); margin-bottom:8px; }
.advice .plan{ font-size:12.5px; color:var(--s-fg-3); border-top:1px dashed var(--s-line-strong); padding-top:8px; margin:0; }
.c-ok{ color:var(--ok); } .c-no{ color:var(--no); } .c-mid{ color:var(--mid); }
.wrong-board{ margin-top:var(--g-sp-3); }
.wb-group{ margin-bottom:var(--g-sp-3); }
.wb-hd{ font-size:13px; font-weight:800; padding:6px 10px; border-radius:var(--g-r-1);
  background:var(--s-surface-2); display:flex; align-items:center; gap:6px; margin-bottom:6px; }
.wb-item{ border:1px solid var(--s-line); border-radius:var(--g-r-2); padding:10px 12px;
  margin-bottom:6px; background:var(--s-surface); }
.wb-q{ font-size:14px; font-weight:600; }
.wb-ans{ font-size:12.5px; margin-top:4px; display:flex; gap:12px; flex-wrap:wrap; }
.wb-full{ font-size:12.5px; color:var(--s-fg-2); margin-top:4px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.wb-ex{ font-size:12px; color:var(--s-fg-3); margin-top:4px; }

/* ---------- 综合测试 (test50 · 只呈现题目) ---------- */
.test50 .paper-head{ display:flex; flex-wrap:wrap; gap:var(--g-sp-3) var(--g-sp-5);
  font-size:13px; color:var(--s-fg-2); padding:var(--g-sp-3) 0; margin-bottom:var(--g-sp-2);
  border-top:1px dashed var(--s-line-strong); border-bottom:1px dashed var(--s-line-strong); }
.t50-sec{ margin-top:var(--g-sp-4); }
.t50-list{ list-style:none; margin:0; padding:0; display:grid; gap:var(--g-sp-3); }
.t50-q{ padding:var(--g-sp-3); border:1px solid var(--s-line); border-radius:var(--g-r-2);
  background:var(--s-surface-2); break-inside:avoid; }
.t50-stem{ font-size:15px; font-weight:600; line-height:1.7; display:flex; align-items:baseline;
  flex-wrap:wrap; gap:6px; }
.t50-no{ font-weight:800; color:var(--s-brand-strong); flex:0 0 auto; }
.t50-opts{ display:grid; grid-template-columns:1fr 1fr; gap:6px 16px; margin-top:8px; padding-left:22px; }
@media(max-width:520px){ .t50-opts{ grid-template-columns:1fr; } }
.t50-opt{ font-size:14px; color:var(--s-fg); }
.t50-opt--ans{ color:var(--ok); font-weight:700; }

/* interactive (在线作答) option buttons */
.t50-opts--pick{ padding-left:22px; gap:8px 12px; }
.t50-optbtn{ font:inherit; font-size:14px; text-align:left; cursor:pointer;
  padding:9px 12px; border:1.5px solid var(--s-line); border-radius:var(--g-r-2);
  background:var(--s-surface); color:var(--s-fg); transition:background .15s,border-color .15s,color .15s;
  width:100%; display:block; }
.t50-optbtn:hover{ background:var(--s-surface-2); border-color:var(--s-brand); }
.t50-opt--sel{ background:var(--s-brand-weak,rgba(88,101,242,.12)); border-color:var(--s-brand);
  color:var(--s-brand-strong); font-weight:700; }

/* Unit 1 / Unit 2 test switcher */
.t50-switch{ display:inline-flex; gap:6px; margin:var(--g-sp-3) 0; flex-wrap:wrap; justify-content:center; }
.t50-swbtn{ font:inherit; font-size:13px; cursor:pointer; padding:7px 16px;
  border:1.5px solid var(--s-line); border-radius:var(--g-r-pill);
  background:var(--s-surface); color:var(--s-fg-2); transition:background .15s,border-color .15s,color .15s; }
.t50-swbtn:hover{ border-color:var(--s-brand); color:var(--s-fg); }
.t50-swbtn--on{ background:var(--s-brand-weak,rgba(88,101,242,.12)); border-color:var(--s-brand);
  color:var(--s-brand-strong); font-weight:700; }

/* ---------- footer ---------- */
.foot{ text-align:center; font-size:11.5px; color:var(--s-fg-3);
  padding:var(--g-sp-6) var(--g-sp-4); }

/* ---------- print ---------- */
@media print{
  .appbar,.tabbar,.play,.collect,.foot,.btnrow,.exam-nav,.sheet{ display:none !important; }
  .card{ box-shadow:none; break-inside:avoid; }
}

  const Q = [];

  const wordEns = W.map(w => w.en);
  W.forEach(w => {
    // 干扰项:同表其它词
    const distract = wordEns.filter(e => e !== w.en);
    Q.push({
      type:"trans", word:w.en, kind:"zh2en",
      prompt:"选出对应的英文:「" + w.zh.replace(/^(n\.|v\.|adj\.|adv\.|prep\.|v\.\/n\.|adj\.\/n\.)\s*/,'') + "」",
      answer:w.en, options:[w.en, ...pick(distract,3)], say:w.en
    });
  });

  // 2) 单词 cloze(句中填空,考在真实语境中的用法) —— 用词卡例句挖空
  W.forEach(w => {
    const blanked = blankWord(w.example, w.en);
    if (!blanked) return;
    const distract = wordEns.filter(e => e !== w.en);
    Q.push({
      type:"cloze", word:w.en,
      prompt:blanked, promptZh:w.zh,
      answer:w.en, options:[w.en, ...pick(distract,3)],
      say:w.example, full:w.example, ann:w.ann
    });
  });

  // 3) 重点短语 中→英 (覆盖全部短语)
  D.phrases.forEach(p => {
    const distract = D.phrases.filter(x => x.en !== p.en).map(x => x.en);
    Q.push({
      type:"trans", word:p.en, kind:"phrase",
      prompt:"选出对应的英文短语:「" + p.zh + "」",
      answer:p.en, options:[p.en, ...pick(distract,3)], say:p.en
    });
  });

  // 4) 句型识别 identify (覆盖每个母题) —— 给例句判断属于哪个句型
  const allPat = [];
  D.groups.forEach(g => g.patterns.forEach(p => allPat.push({ ...p, gName:g.name })));
  allPat.forEach(p => {
    const ex = p.examples[0];

  const compPairs = [];
  D.gramCompare.rules.forEach(r => r.ex.forEach(e => compPairs.push(e)));

      full:"Apples are healthier than sweet cakes.", ann:[["s","Apples"],["v","are"],["o","healthier"],["a","than sweet cakes"]] },
    { word:"p_whynot", pattern:"p_whynot",
      q:"Why not ___ your money?", answer:"save",

      full:"Why not save your money?", ann:[["c","Why not"],["v","save"],["o","your money"]] },
    { word:"p_opinion", pattern:"p_opinion",
      q:"In my ___, this book is interesting.", answer:"opinion",
      options:["opinion","idea","think","reason"], zh:"在我看来,这本书很有趣。",
      full:"In my opinion, this book is interesting.", ann:[["a","In my opinion"],["s","this book"],["v","is"],["o","interesting"]] },
    { word:"p_remember", pattern:"p_remember",
      q:"Just remember, gold ___ everything.", answer:"isn't",
      options:["isn't","aren't","don't","not"], zh:"只要记住,金子不是万能的。",
      full:"Just remember, gold isn't everything.", ann:[["v","Just remember"],["s","gold"],["v","isn't"],["o","everything"]] }
  ];
  usage.forEach(u => {
    Q.push({ type:"cloze", word:u.word, pattern:u.pattern,
      prompt:u.q, promptZh:u.zh, answer:u.answer, options:shuffle(u.options.slice()),
      say:u.full, full:u.full, ann:u.ann });
  });

  D.quiz = Q;

  /* ---------- 摸底测试卷(单项选择·不提示考点) ----------
   * perQuestion: 每题分值;20题 × 5分 = 100分
   */
  D.exam = {
    title: "Unit 1–2 摸底测试卷",
    intro: "共 20 道单项选择 · 满分 100 分 · 题目随机打乱、不提示考点。答完后给出对/错统计、各板块掌握情况和学习建议。",
    perQuestion: 5,
    sections: [
      { id:"vocab", name:"词汇", en:"Vocabulary", icon:"ic-hash", color:"cyan", desc:"单词与短语的含义、辨析", items:[
        { q:"I want to ___ my pocket money, not spend it.", zh:"我想存零花钱,而不是花掉。", options:["save","spend","cost","pay"], answer:"save", explain:"save 存钱;spend 花钱。语义与后半句对比,选 save。" },
        { q:"Fruit and vegetables are good for our ___.", zh:"水果和蔬菜对我们的健康有益。", options:["health","healthy","healthily","healthier"], answer:"health", explain:"介词 for 后接名词,health 为名词“健康”。" },
        { q:"We should help ___ in need.", zh:"我们应该帮助需要帮助的人。", options:["people","peoples","person","the peoples"], answer:"people", explain:"people 本身是复数,不加 s;people in need 需要帮助的人。" },
        { q:"The ___ told me the price of the toy.", zh:"店主告诉了我玩具的价格。", options:["shopkeeper","teacher","doctor","farmer"], answer:"shopkeeper", explain:"shopkeeper 店主,与 price of the toy 语境相符。" }
      ]},
      { id:"phrase", name:"短语", en:"Phrases", icon:"ic-layers", color:"amber", desc:"固定搭配", items:[
        { q:"Too much sugar is bad ___ your teeth.", zh:"太多糖对你的牙齿有害。", options:["for","to","at","with"], answer:"for", explain:"be bad for sth 对……有害;固定搭配用 for。" },
        { q:"The box is full ___ old books.", zh:"这个箱子装满了旧书。", options:["of","with","in","at"], answer:"of", explain:"be full of 充满……,固定搭配。" },
        { q:"Don't ___ with your friends over small things.", zh:"别为小事和朋友争吵。", options:["argue","talk","listen","agree"], answer:"argue", explain:"argue with sb 和某人争吵。" },
        { q:"From now ___, I'll make a spending plan.", zh:"从现在起,我要制定消费计划。", options:["on","in","at","to"], answer:"on", explain:"from now on 从现在起,固定短语。" }
      ]},
      { id:"pattern", name:"句型", en:"Patterns", icon:"ic-message-square", color:"brand", desc:"询价·建议·观点·购买", items:[
        { q:"— How much ___ the cupcakes? — They're 5 yuan each.", zh:"这些纸杯蛋糕多少钱?每个5元。", options:["are","is","do","does"], answer:"are", explain:"cupcakes 为复数,How much are...? 回答 They're... each。" },
        { q:"How much ___ the robot? It's 99 yuan.", zh:"这个机器人多少钱?99元。", options:["is","are","many","much"], answer:"is", explain:"robot 单数,用 How much is...? 回答 It's...。" },

      { id:"grammar", name:"语法", en:"Grammar", icon:"ic-git-branch", color:"green", desc:"比较级·一般现在时", items:[

      ]}
    ]
  };

  /* ---------- 工具函数 ---------- */
  function pick(arr, n){ const a=arr.slice(); shuffle(a); return a.slice(0,n); }
  function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
  function uniq(a){ return [...new Set(a)]; }
  function blankWord(sent, word){
    // 用单条下划线空位替换句中的目标词(整词匹配,忽略大小写)
    const re = new RegExp("\\b" + word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + "\\b", "i");
    if (!re.test(sent)) return null;
    return sent.replace(re, "___");
  }
  function wrongComps(base, comp){
    const out = [];
    if (comp === base + "er") { out.push("more " + base, base + "est"); }
    else if (comp.endsWith("r")) { out.push(base + "er", "more " + base); }
    else if (comp.startsWith("more ")) { out.push(base + "er", base + "r"); }
    else { out.push(base + "er", "more " + base); } // 不规则
    return out;
  }

  const rate = (RATE_LEVELS[_rate] || RATE_LEVELS.normal).ssml;
  return `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xml:lang='en-US'>`
    + `<voice name='${EDGE_VOICE}'><prosody rate='${rate}' pitch='+0Hz'>${esc}</prosody></voice></speak>`;
}
let _ws = null, _wsReady = null;
const _pending = new Map();
function _connect(){
  if (_wsReady) return _wsReady;
  _wsReady = new Promise((resolve, reject) => {
    let ws;
    try { ws = new WebSocket(EDGE_WSS); } catch(e){ _wsReady = null; return reject(e); }
    ws.binaryType = 'arraybuffer';
    const openTimer = setTimeout(() => { try{ws.close();}catch(e){} _wsReady=null; reject(new Error('open timeout')); }, 6000);
    ws.onopen = () => {
      clearTimeout(openTimer);
      ws.send(`X-Timestamp:${_dateStr()}\r\nContent-Type:application/json; charset=utf-8\r\nPath:speech.config\r\n\r\n`
        + `{"context":{"synthesis":{"audio":{"metadataoptions":{"sentenceBoundaryEnabled":"false","wordBoundaryEnabled":"false"},"outputFormat":"audio-24khz-48kbitrate-mono-mp3"}}}}`);
      _ws = ws; resolve(ws);
    };
    ws.onmessage = (ev) => {
      if (typeof ev.data === 'string') {
        const m = ev.data.match(/X-RequestId:([0-9a-f]+)/i); const id = m && m[1];
        if (ev.data.includes('Path:turn.end') && id && _pending.has(id)) {
          const st = _pending.get(id); _pending.delete(id); clearTimeout(st.timer);
          if (!st.chunks.length) return st.reject(new Error('no audio'));
          st.resolve(URL.createObjectURL(new Blob(st.chunks, { type: 'audio/mpeg' })));
        }
      } else {
        const buf = new Uint8Array(ev.data);
        const headerLen = (buf[0] << 8) | buf[1];
        const header = new TextDecoder().decode(buf.slice(2, 2 + headerLen));
        const m = header.match(/X-RequestId:([0-9a-f]+)/i); const id = m && m[1];
        const audio = buf.slice(2 + headerLen);
        if (id && _pending.has(id) && audio.length) _pending.get(id).chunks.push(audio);
      }
    };
    const drop = () => { _ws = null; _wsReady = null; _pending.forEach(st => { clearTimeout(st.timer); st.reject(new Error('ws closed')); }); _pending.clear(); };
    ws.onerror = drop; ws.onclose = drop;
  });
  return _wsReady;
}
function _edgeSynth(text){
  return _connect().then(ws => new Promise((resolve, reject) => {
    const id = _uuid().replace(/-/g,'').toUpperCase();
    const timer = setTimeout(() => { if (_pending.has(id)) { _pending.delete(id); reject(new Error('timeout')); } }, 5000);
    _pending.set(id, { chunks: [], resolve, reject, timer });
    try {
      ws.send(`X-RequestId:${id}\r\nContent-Type:application/ssml+xml\r\nX-Timestamp:${_dateStr()}Z\r\nPath:ssml\r\n\r\n` + _ssml(text));
    } catch(e){ _pending.delete(id); clearTimeout(timer); reject(e); }
  }));
}
function _prewarm(sentences){
  if (_edgeBlocked) return;
  let i = 0;
  const step = () => {
    if (i >= sentences.length || _edgeBlocked) return;
    const text = sentences[i++]; const key = _rate + '|' + text;
    if (_edgeCache.has(key)) { step(); return; }
    _edgeSynth(text).then(url => { _edgeCache.set(key, url); setTimeout(step, 60); }).catch(() => { setTimeout(step, 60); });
  };
  setTimeout(step, 120);
}
function setRate(r){ if(RATE_LEVELS[r]){ _rate = r; _edgeCache.clear(); if (window.__allSentences) _prewarm(window.__allSentences); } }
function speak(text, btnEl){
  if (!text) return;
  if (btnEl) btnEl.classList.add('playing');
  const done = () => { if (btnEl) btnEl.classList.remove('playing'); };
  try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch(e){}
  if (!window.__ttsAudio) window.__ttsAudio = new Audio();
  const a = window.__ttsAudio; a.volume = 0.6;
  try { a.pause(); } catch(e){}
  const playUrl = (url) => { a.onended = done; a.onerror = () => _localSpeak(text, btnEl); a.src = url; const p = a.play(); if (p && p.catch) p.catch(() => _localSpeak(text, btnEl)); };
  if (_edgeBlocked) { _localSpeak(text, btnEl); return; }
  const cacheKey = _rate + '|' + text;
  if (_edgeCache.has(cacheKey)) { playUrl(_edgeCache.get(cacheKey)); return; }
  let settled = false;
  const grace = setTimeout(() => { if (settled) return; settled = true; _localSpeak(text, btnEl); }, 450);
  _edgeSynth(text).then(url => { _edgeCache.set(cacheKey, url); if (settled) return; settled = true; clearTimeout(grace); playUrl(url); })
    .catch(() => { if (settled) { _edgeBlocked = true; return; } settled = true; clearTimeout(grace); _edgeBlocked = true; _localSpeak(text, btnEl); });
}
let _voices = [], _bestVoice = null;
function _pickVoice(){
  try { _voices = window.speechSynthesis.getVoices() || []; } catch(e){ _voices = []; }
  if (!_voices.length) return null;
  const en = _voices.filter(v => /^en(-|_)/i.test(v.lang) || /english/i.test(v.name));
  if (!en.length) { _bestVoice = _voices[0]; return _bestVoice; }
  const score = (v) => { const n=(v.name||'').toLowerCase(); let s=0;
    if(/natural|neural|online|wavenet|premium|enhanced/.test(n)) s+=50;
    if(/google/.test(n)) s+=30; if(/microsoft|aria|jenny|guy|libby|sonia/.test(n)) s+=28;
    if(/samantha|karen|daniel|serena|moira/.test(n)) s+=20;
    if(/^en-us/i.test(v.lang)) s+=12; else if(/^en-gb/i.test(v.lang)) s+=10; else s+=4;
    if(v.localService===false) s+=8; return s; };
  en.sort((a,b)=>score(b)-score(a)); _bestVoice = en[0]; return _bestVoice;
}
if (typeof window!=='undefined' && 'speechSynthesis' in window) { _pickVoice(); window.speechSynthesis.onvoiceschanged = _pickVoice; }
function _localSpeak(text, btnEl){
  try {
    if (!('speechSynthesis' in window)) { if(btnEl) btnEl.classList.remove('playing'); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = _bestVoice || _pickVoice();
    if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'en-US'; }
    u.rate = (RATE_LEVELS[_rate] || RATE_LEVELS.normal).local; u.pitch = 1.0; u.volume = 0.6;
    if (btnEl) { u.onend = () => btnEl.classList.remove('playing'); u.onerror = () => btnEl.classList.remove('playing'); }
    window.speechSynthesis.speak(u);
  } catch (e) { if(btnEl) btnEl.classList.remove('playing'); }
}

function ico(id){ return svg`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#${id}"></use></svg>`; }

// ===================== annotation + IPA helpers =====================
const _RMAP  = { s:'subj', v:'verb', o:'obj', a:'other', c:'conj' };
const _RNAME = { s:'主语', v:'谓语', o:'宾语', a:'状语', c:'引导词' };
function annUnderline(ann){
  return html`<span class="sent-underline">${ann.map((p,i)=>{
    const role=_RMAP[p[0]]||'obj'; const last=i===ann.length-1;
    return html`<span class="tk-u tk-u--${role}"><span class="tk-u__word">${p[1]}</span><span class="tk-u__tag">${_RNAME[p[0]]||''}</span></span>${last?'':html` `}`;
  })}</span>`;
}
function sentenceIPA(sent){
  const dict = window.IPA_DICT || {};
  const words = String(sent).trim().split(/\s+/).map(t=>{
    let c = t.toLowerCase().replace(/[.,!?;:"()]/g,'').replace(/[’‘]/g,'').replace(/'/g,'');
    return dict[c] ? dict[c].replace(/^\/|\/$/g,'') : '';
  }).filter(Boolean);
  return '/' + words.join(' ') + '/';
}

const DATA = (typeof window!=='undefined' && window.TOPIC_DATA) ? window.TOPIC_DATA : {};

// Safe storage shim — sandboxed iframes (no allow-same-origin) throw a SecurityError
// on ANY localStorage property access, even reads. Route everything through here so
// the app degrades to an in-memory store instead of crashing on boot.
const LS = (function(){
  const mem = {};
  let real = null;
  try { real = window.localStorage; real.getItem('__t'); } catch(e){ real = null; }
  return {
    get(k){ try{ return real ? real.getItem(k) : (k in mem ? mem[k] : null); }catch(e){ return (k in mem)?mem[k]:null; } },
    set(k,v){ try{ if(real){ real.setItem(k,v); return; } }catch(e){} mem[k]=String(v); }
  };
})();

const KEY_WRONG = 'u12_wrong_v1';
const KEY_FAVS  = 'u12_favs_v1';
const KEY_THEME = 'u12_theme_v1';

class TopicApp extends LitElement {
  createRenderRoot(){ return this; }
  static get properties(){ return {
    tab:{state:true}, rate:{state:true}, theme:{state:true},

    // exam
    examStage:{state:true}, examIdx:{state:true},
    // test50
    test50Answers:{state:true}, t50Stage:{state:true}, t50Picks:{state:true}, t50Which:{state:true},
  };}
  constructor(){
    super();
    this.data = DATA;
    this.tab = 'learn';
    this.rate = 'normal';
    this.theme = LS.get(KEY_THEME) || '';
    this.quizMode = 'normal'; this.quizStage = 'idle'; this.qIndex = 0;
    this.picked = null; this.score = 0; this.combo = 0; this._tick = 0;
    this._quiz = [];
    this.wrong = this._loadWrong();
    this.favs = this._loadFavs();
    // exam
    this.examStage = 'intro'; this.examIdx = 0;
    this.examAnswers = {};
    this._examFlat = this._shuffleExam();
    // test50 (综合测试:在线作答 + 出结果)
    this.test50Answers = false;
    this.t50Stage = 'intro';   // intro | run | result
    this.t50Which = 'unit1';   // unit1 | unit2
    this.t50Picks = {};        // { [no]: selectedOption }
  }
  static get FAV_INTERVALS(){ return [1,2,4,7,15,30]; }

  // ---- storage ----
  _loadWrong(){ try{ return new Set(JSON.parse(LS.get(KEY_WRONG)||'[]')); }catch(e){ return new Set(); } }
  _saveWrong(){ try{ LS.set(KEY_WRONG, JSON.stringify([...this.wrong])); }catch(e){} }
  _loadFavs(){ try{ return new Map(Object.entries(JSON.parse(LS.get(KEY_FAVS)||'{}'))); }catch(e){ return new Map(); } }
  _saveFavs(){ try{ LS.set(KEY_FAVS, JSON.stringify(Object.fromEntries(this.favs))); }catch(e){} }

  firstUpdated(){
    if (this.theme) document.documentElement.setAttribute('data-theme', this.theme);
    (async()=>{
      try{ await this.updateComplete; }catch(e){}
      const b = (typeof document!=='undefined') && document.getElementById('boot'); if (b) b.remove();
      try{
        const list = this._allSentences(); window.__allSentences = list;
        if (typeof _connect === 'function') _connect();
        if (typeof _prewarm === 'function') _prewarm(list);
      }catch(e){}
    })();
  }
  _allSentences(){
    const s = new Set();
    (this.data.scenes||[]).forEach(sc=>sc.words.forEach(w=>{ s.add(w.en); if(w.example) s.add(w.example); }));
    (this.data.phrases||[]).forEach(p=>s.add(p.en));
    (this.data.groups||[]).forEach(g=>g.patterns.forEach(p=>p.examples.forEach(e=>s.add(e.en))));
    (this.data.goodSentences||[]).forEach(x=>s.add(x.en));
    return [...s];
  }

  // ---- theme / rate ----
  toggleTheme(){ this.theme = this.theme==='dark' ? '' : 'dark'; document.documentElement.setAttribute('data-theme', this.theme); LS.set(KEY_THEME,this.theme); }
  changeRate(r){ setRate(r); this.rate = r; }

  // ---- 收藏本 ----
  isCollected(en){ return this.favs.has(en); }
  toggleCollect(en){ const m=new Map(this.favs); if(m.has(en)) m.delete(en); else m.set(en,{level:0,due:Date.now(),added:Date.now()}); this.favs=m; this._saveFavs(); this.requestUpdate(); }
  _dueWords(){ const now=Date.now(),o=[]; this.favs.forEach((v,w)=>{ if(!v.due||v.due<=now) o.push(w); }); return o; }
  _reviewFav(word, correct){ const IV=TopicApp.FAV_INTERVALS, m=new Map(this.favs), cur=m.get(word)||{level:0}; const level = correct ? Math.min((cur.level||0)+1, IV.length-1) : 0; m.set(word,{level,due:Date.now()+IV[level]*86400000,added:cur.added||Date.now()}); this.favs=m; this._saveFavs(); }
  _wordByEn(en){ let f=null; (this.data.scenes||[]).forEach(s=>s.words.forEach(w=>{ if(w.en===en) f=w; })); return f; }

  // ---- 错题本 ----
  _qWord(q){ return q.word || q.say; }
  _wrongQuestions(){
    const byWord=new Map();
    (this.data.quiz||[]).forEach(q=>{ const k=this._qWord(q); if(this.wrong.has(k)&&!byWord.has(k)) byWord.set(k,q); });
    return [...byWord.values()];
  }
  clearWrong(){ this.wrong = new Set(); this._saveWrong(); this.requestUpdate(); }

  // ================= render =================
  render(){
    const tabs = [
      ['learn','知识讲解','ic-book-open'],
      ['quiz','闯关练习','ic-target'],
      ['test50','综合测试','ic-edit'],
      ['wrong','错题本','ic-refresh'],
      ['fav','收藏本','ic-star'],
      ['exam','摸底测试','ic-award'],
    ];
    return html`
      <header class="appbar">
        <div class="appbar__title">
          <span class="brandmark">${ico('ic-book-open')}</span>

            <div class="ttl">${this.data.title}</div>

          </div>
        </div>
        <div class="appbar__tools">
          <div class="rate-seg" title="朗读语速">
            ${['slow','normal','fast'].map(r=>html`<button class="rate-opt ${this.rate===r?'rate-opt--on':''}" @click=${()=>this.changeRate(r)}>${RATE_LEVELS[r].label}</button>`)}
          </div>
          <button class="icon-btn" @click=${()=>this.toggleTheme()} title="深/浅色">${ico(this.theme==='dark'?'ic-sun':'ic-moon')}</button>
        </div>
      </header>
      <nav class="tabbar">
        ${tabs.map(([k,label,icon])=>{
          let badge=''; if(k==='wrong'&&this.wrong.size) badge=this.wrong.size; if(k==='fav'&&this.favs.size) badge=this.favs.size;
          return html`<button class="tab ${this.tab===k?'tab--on':''}" @click=${()=>{this.tab=k;}}>${ico(icon)}<span>${label}</span>${badge?html`<i class="tab-badge">${badge}</i>`:''}</button>`;
        })}

      <main class="wrap">
        ${this.tab==='learn'?this.renderLearn():''}
        ${this.tab==='quiz'?this.renderQuiz():''}
        ${this.tab==='test50'?this.renderTest50():''}
        ${this.tab==='wrong'?this.renderWrong():''}
        ${this.tab==='fav'?this.renderFav():''}
        ${this.tab==='exam'?this.renderExam():''}
      </main>
      <footer class="foot">离线单文件 · 真人发音(Edge Neural) · 音标全覆盖 · 外研版六年级上册 Unit 1–2</footer>
    `;
  }

  _audioBtn(text){ return html`<button class="play" title="朗读" @click=${e=>speak(text, e.currentTarget)}>${ico('ic-volume')}</button>`; }

  // ---------- 讲解 ----------
  renderLearn(){
    const d = this.data;
    return html`
      ${this._legend()}
      ${(d.scenes||[]).map(sc=>html`
        <section class="card">

          </div>
          <div class="wordgrid">
            ${sc.words.map(w=>{ const on=this.isCollected(w.en); return html`
              <div class="wcard">
                <div class="wcard__top">
                  <span class="wen">${w.en}</span>
                  ${this._audioBtn(w.en)}
                  <button class="collect ${on?'collect--on':''}" title=${on?'已收藏,点按取消':'收藏到生词本(单独记忆·定期复习)'} @click=${()=>this.toggleCollect(w.en)}>${ico('ic-star')}</button>
                </div>

          </div>

      <section class="card">
        <div class="card__hd hd--amber">${ico('ic-layers')}<h2>重点短语<small>Key Phrases</small></h2></div>
        <div class="phrasegrid">

  _exZh(w){ return ''; } // word examples show only English + IPA; zh in patterns
  _legend(){
    return html`<div class="legend">
      <div class="legend__t">${ico('ic-info')} 怎么组句子:<b>主语 → 谓语 → 宾语</b>,状语(时间/地点)常放句末(与中文不同)。颜色对应成分:</div>

  readAll(list){ let i=0; const step=()=>{ if(i>=list.length) return; speak(list[i++]); const a=window.__ttsAudio; if(a){ a.onended=()=>setTimeout(step,180); a.onerror=()=>setTimeout(step,700);} else setTimeout(step,900); }; step(); }

  // ---------- 练习闯关 ----------
  startQuiz(mode){
    this.quizMode = mode;
    let pool;
    if (mode==='review') pool = this._wrongQuestions();
    else if (mode==='fav') pool = this._favDueQuestions();
    else if (mode==='unit1') pool = ((this.data.unit1Drill&&this.data.unit1Drill.items)||[]).slice();
    else pool = (this.data.quiz||[]).slice();
    pool = this._shuffle(pool.slice());
    if (mode==='normal') pool = pool.slice(0, Math.min(25, pool.length));
    // shuffle each question's options
    this._quiz = pool.map(q=>({ ...q, opts:this._shuffle(q.options.slice()) }));
    this.qIndex = 0; this.picked = null; this.score = 0; this.combo = 0;
    this.quizStage = this._quiz.length ? 'run' : 'empty';
  }
  _favDueQuestions(){
    const due = new Set(this._dueWords());
    const byWord=new Map();
    (this.data.quiz||[]).forEach(q=>{ const k=this._qWord(q); if(due.has(k)&&!byWord.has(k)) byWord.set(k,q); });
    return [...byWord.values()];
  }
  pickQ(i){
    if (this.picked!==null) return;
    const q=this._quiz[this.qIndex], k=this._qWord(q), correct=q.opts[i]===q.answer;
    this.picked = i;
    if (correct){ this.score++; this.combo++; } else { this.combo=0; }
    if (this.quizMode==='review'){
      if (correct && this.wrong.has(k)){ const n=new Set(this.wrong); n.delete(k); this.wrong=n; this._saveWrong(); }
    } else if (this.quizMode==='fav'){ this._reviewFav(k, correct); }
    else { if (!correct && !this.wrong.has(k)){ this.wrong=new Set([...this.wrong,k]); this._saveWrong(); } }
    // auto play correct
    if (q.say) setTimeout(()=>speak(q.say), 250);
    this.requestUpdate();
  }
  nextQ(){
    if (this.qIndex < this._quiz.length-1){ this.qIndex++; this.picked=null; }
    else { this.quizStage='done'; }
  }
  renderQuiz(){
    if (this.quizStage==='idle' || this.quizStage==='empty'){
      return html`<section class="card center">
        <h2 class="big">${ico('ic-target')} 闯关练习</h2>
        <p class="muted">题库覆盖全部单词、短语、句型与语法,包含<b>句中填空</b>(考搭配用法,不只是死记)。答错自动进入错题本。</p>
        ${this.quizStage==='empty'?html`<p class="warn">当前没有可练习的题目。</p>`:''}
        <div class="btnrow">
          <button class="btn btn--primary" @click=${()=>this.startQuiz('normal')}>${ico('ic-target')} 开始练习(随机25题)</button>
          ${this.data.unit1Drill?html`<button class="btn" @click=${()=>this.startQuiz('unit1')}>${ico('ic-layers')} Unit 1 专项(${this.data.unit1Drill.items.length}题)</button>`:''}
          ${this.wrong.size?html`<button class="btn" @click=${()=>this.startQuiz('review')}>${ico('ic-refresh')} 复习错题(${this.wrong.size})</button>`:''}
        </div>
        <div class="qtypes">
          <span class="chip">中英互译</span><span class="chip">句中填空</span><span class="chip">句型识别</span><span class="chip">比较级</span><span class="chip">句型运用</span>
        </div>
      </section>`;
    }
    if (this.quizStage==='done'){
      const total=this._quiz.length, pct=total?Math.round(this.score/total*100):0;
      const emptyNow = (this.quizMode==='review' && this.wrong.size===0);
      return html`<section class="card center">
        <h2 class="big">${ico('ic-award')} 完成!</h2>
        <div class="scorebig">${this.score} / ${total} <small>(${pct}%)</small></div>
        ${this.quizMode==='review'?(emptyNow?html`<p class="ok">太棒了,错题本已清空!</p>`:html`<p class="muted">还剩 ${this.wrong.size} 个词在错题本,继续加油。</p>`):''}
        <div class="btnrow">
          <button class="btn btn--primary" @click=${()=>this.startQuiz(this.quizMode)}>再来一轮</button>
          <button class="btn" @click=${()=>{this.quizStage='idle';}}>返回</button>
        </div>
      </section>`;
    }
    // run
    const q=this._quiz[this.qIndex], total=this._quiz.length, done=this.qIndex+ (this.picked!==null?1:0);
    return html`<section class="card">
      <div class="quiz-hd">
        <div class="progress"><span style="width:${Math.round((this.qIndex)/total*100)}%"></span></div>
        <div class="quiz-meta"><span>${this.qIndex+1} / ${total}</span>${this.combo>1?html`<span class="combo">🔥 连对 ${this.combo}</span>`:''}<span>得分 ${this.score}</span></div>
      </div>
      <div class="qtype">${this._qTypeName(q)}</div>
      <div class="qstem">${this._qStem(q)}</div>
      ${q.promptZh?html`<div class="qzh">${q.promptZh}</div>`:''}
      ${q.say?html`<div class="qplay">${this._audioBtn(q.say)}</div>`:''}
      <div class="opts">
        ${q.opts.map((op,i)=>{
          let cls='opt';
          if(this.picked!==null){ if(op===q.answer) cls+=' opt--right'; else if(i===this.picked) cls+=' opt--wrong'; }
          return html`<button class="${cls}" @click=${()=>this.pickQ(i)}>${op}</button>`;
        })}
      </div>
      ${this.picked!==null?this._qReveal(q):''}
      ${this.picked!==null?html`<div class="btnrow"><button class="btn btn--primary" @click=${()=>this.nextQ()}>${this.qIndex<total-1?'下一题':'查看结果'} ${ico('ic-arrow-right')}</button></div>`:''}
    </section>`;
  }
  _qTypeName(q){ return ({trans:'中英互译',cloze:'句中填空',identify:'句型识别',grammar:'比较级',order:'句子排序'})[q.type]||'练习'; }
  _qStem(q){
    if (q.type==='cloze'){
      const parts=String(q.prompt).split('___');
      const out=[];
      for(let i=0;i<parts.length;i++){ out.push(parts[i]); if(i<parts.length-1) out.push(html`<span class="blank"></span>`); }
      return html`<span class="stem-clz">${out}</span>`;
    }
    return html`<span>${q.prompt}</span>`;
  }
  _qReveal(q){
    const right = q.opts[this.picked]===q.answer;
    return html`<div class="reveal ${right?'reveal--ok':'reveal--no'}">
      <div class="reveal__hd">${right?html`${ico('ic-check-circle-2')} 回答正确`:html`${ico('ic-x-circle')} 正确答案:<b>${q.answer}</b>`}</div>
      ${q.full?html`<div class="reveal__sent">${q.ann?annUnderline(q.ann):q.full}<div class="wex__ipa">${sentenceIPA(q.full)} ${this._audioBtn(q.full)}</div></div>`:''}
    </div>`;
  }

  // ---------- 综合测试(50题·在线作答 + 出结果) ----------
  _t50Stem(stem){
    const parts=String(stem).split(/_{3,}/);
    const out=[];
    for(let i=0;i<parts.length;i++){ out.push(parts[i]); if(i<parts.length-1) out.push(html`<span class="blank"></span>`); }
    return html`<span class="stem-clz">${out}</span>`;
  }
  _t50Data(){ return this.t50Which==='unit2' ? this.data.unit2Test50 : this.data.unit1Test50; }
  _t50Items(){ const t=this._t50Data(); return (t && t.items) || []; }
  t50SetWhich(which){ if(this.t50Which===which) return; this.t50Which = which; this.t50Picks = {}; this.t50Stage = 'intro'; }
  t50Start(){ this.t50Picks = {}; this.t50Stage = 'run'; try{ scrollTo(0,0); }catch(e){} }
  t50Pick(no, opt){ this.t50Picks = { ...this.t50Picks, [no]:opt }; }
  t50Answered(){ return Object.keys(this.t50Picks).length; }
  t50Submit(){ this.t50Stage = 'result'; try{ scrollTo(0,0); }catch(e){} }
  t50Retry(){ this.t50Picks = {}; this.t50Stage = 'run'; try{ scrollTo(0,0); }catch(e){} }
  t50Correct(){ return this._t50Items().filter(q=>this.t50Picks[q.no]===q.answer).length; }
  t50SectionStat(){
    const t=this._t50Data(); const out=[];
    t.sections.forEach(sec=>{
      const qs=t.items.filter(q=>q.sec===sec);
      const ok=qs.filter(q=>this.t50Picks[q.no]===q.answer).length;
      out.push({ sec, tot:qs.length, ok, pct: qs.length?Math.round(ok/qs.length*100):0 });
    });
    return out;
  }

  renderTest50(){
    const t = this._t50Data();
    if(!t) return html`<section class="card"><p class="muted">暂无综合测试数据。</p></section>`;
    if(this.t50Stage==='result') return this._renderTest50Result();
    if(this.t50Stage==='run') return this._renderTest50Run();
    return this._renderTest50Intro();
  }
  _t50Switcher(){
    const opts=[['unit1','Unit 1 · 消费与钱'],['unit2','Unit 2 · 观点与探索']];

      ${opts.map(([k,label])=>html`<button class="t50-swbtn ${this.t50Which===k?'t50-swbtn--on':''}" @click=${()=>this.t50SetWhich(k)}>${label}</button>`)}
    </div>`;

      <p class="muted">${t.desc}</p>

      </div>

        ${secs.filter(s=>s.pct<60).length?html`<p class="plan">建议重点复习:${secs.filter(s=>s.pct<60).map(s=>s.sec).join('、')}。</p>`:''}

          ${wrongItems.map(q=>{
            const mine=this.t50Picks[q.no];
            return html`<div class="wb-item">
              <div class="wb-q"><span class="t50-no">${q.no}.</span> ${this._t50Stem(q.stem)} ${this._audioBtn(q.say||q.answer)} <span class="chip" style="margin-left:4px">${q.sec}</span></div>
              <div class="wb-ans">
                <span class="c-no">你的答案:${mine?mine:'未作答'}</span>

      :html`<div class="empty">${ico('ic-check-circle-2')}<p>全部答对,满分通过!</p></div>`}
      <div class="btnrow">
        <button class="btn btn--primary" @click=${()=>this.t50Retry()}>${ico('ic-refresh')} 重新作答</button>

  // ---------- 摸底测试卷 ----------
  _shuffleExam(){
    const flat=[];
    (this.data.exam?this.data.exam.sections:[]).forEach(s=>s.items.forEach(it=>flat.push({ ...it, secId:s.id, secName:s.name, secColor:s.color })));
    return this._shuffle(flat.slice());
  }
  examFull(q){ return q.q.replace('___', q.answer==='/'?'':q.answer).replace(/\s+/g,' ').trim(); }
  pickExam(i){ if(this.examAnswers[i]!==undefined) return; }
  chooseExam(opt){ this.examAnswers = { ...this.examAnswers, [this.examIdx]: opt }; this.requestUpdate(); }
  gotoExam(i){ this.examIdx=i; }
  submitExam(){ this.examStage='result'; window.scrollTo && window.scrollTo(0,0); }
  examCorrect(){ let n=0; this._examFlat.forEach((q,i)=>{ if(this.examAnswers[i]===q.answer) n++; }); return n; }
  examWrongAnswered(){ let n=0; this._examFlat.forEach((q,i)=>{ if(this.examAnswers[i]!==undefined && this.examAnswers[i]!==q.answer) n++; }); return n; }
  examUnanswered(){ let n=0; this._examFlat.forEach((q,i)=>{ if(this.examAnswers[i]===undefined) n++; }); return n; }
  examSectionScore(id){ let ok=0,tot=0; this._examFlat.forEach((q,i)=>{ if(q.secId===id){ tot++; if(this.examAnswers[i]===q.answer) ok++; } }); return {ok,tot}; }
  examWrongByBoard(){
    return (this.data.exam.sections||[]).map(s=>({ sec:s, items:this._examFlat.map((q,g)=>({...q,g})).filter(q=>q.secId===s.id && this.examAnswers[q.g]!==q.answer) })).filter(b=>b.items.length>0);
  }
  examAdvice(){
    const secs=this.data.exam.sections.map(s=>{ const {ok,tot}=this.examSectionScore(s.id); return {name:s.name, pct:tot?Math.round(ok/tot*100):0}; });
    const weak=secs.filter(s=>s.pct<60), mid=secs.filter(s=>s.pct>=60&&s.pct<85), strong=secs.filter(s=>s.pct>=85);
    return {weak,mid,strong};
  }

      </section>`;
    }
    if (this.examStage==='result'){
      const c=this.examCorrect(), w=this.examWrongAnswered(), u=this.examUnanswered();
      const scoreN=c*per, pct=Math.round(c/total*100);
      const level = pct>=90?'优秀':pct>=75?'良好':pct>=60?'及格':'待提升';
      const adv=this.examAdvice();
      const wb=this.examWrongByBoard();
      return html`<section class="card">
        <div class="card__hd hd--brand">${ico('ic-award')}<h2>测试报告<small>Diagnosis</small></h2></div>
        <div class="result-score">
          <div class="rs__num">${scoreN}<small>/${full}</small></div>
          <div class="rs__lv rs--${level}">${level} · 正确率 ${pct}%</div>
        </div>
        <div class="tally">
          <div class="ty ty--ok"><b>${c}</b><span>答对</span></div>
          <div class="ty ty--no"><b>${w}</b><span>答错</span></div>
          <div class="ty ty--un"><b>${u}</b><span>未答</span></div>
          <div class="ty"><b>${total}</b><span>总题数</span></div>
        </div>
        <div class="board-mastery">
          <div class="sec-sub">各板块掌握情况</div>
          ${ex.sections.map(s=>{ const {ok,tot}=this.examSectionScore(s.id); const p=tot?Math.round(ok/tot*100):0; const tag=p>=85?'牢固':p>=60?'一般':'薄弱';
            return html`<div class="bm">
              <span class="bm__name">${s.name}</span>
              <span class="bm__bar"><i style="width:${p}%" class="bar--${p>=85?'ok':p>=60?'mid':'no'}"></i></span>
              <span class="bm__num">${ok}/${tot}</span>
              <span class="bm__tag tag--${p>=85?'ok':p>=60?'mid':'no'}">${tag}</span>
            </div>`; })}
        </div>
        <div class="advice">
          <div class="sec-sub">${ico('ic-lightbulb')} 学习改进建议</div>
          ${adv.weak.length?html`<p><b class="c-no">需重点突破:</b>${adv.weak.map(s=>s.name+'('+s.pct+'%)').join('、')}。先弄懂错题的原理,再针对性地多做同类题、多造句。</p>`:''}
          ${adv.mid.length?html`<p><b class="c-mid">仍有提升空间:</b>${adv.mid.map(s=>s.name+'('+s.pct+'%)').join('、')}。把错题重做一遍,并试着用这些词/句型各造一个句子。</p>`:''}
          ${adv.strong.length?html`<p><b class="c-ok">已经掌握:</b>${adv.strong.map(s=>s.name).join('、')}。保持住!</p>`:''}
          <p class="plan">复习计划:今天弄懂错题 → 明天重做错题 → 一周后再测一次查漏补缺。</p>
        </div>
        ${wb.length?html`<div class="wrong-board">
          <div class="sec-sub">${ico('ic-refresh')} 错题本(按板块归类)</div>
          ${wb.map(b=>html`<div class="wb-group">
            <div class="wb-hd hd--${b.sec.color}">${ico(b.sec.icon)} ${b.sec.name} · 错 ${b.items.length} 题</div>
            ${b.items.map(q=>{ const full=this.examFull(q); const my=this.examAnswers[q.g];
              return html`<div class="wb-item">
                <div class="wb-q">${String(q.q).replace('___','____')}</div>
                <div class="wb-ans"><span class="c-no">你的答案:${my===undefined?'未答':my}</span> <span class="c-ok">正确:${q.answer}</span></div>
                <div class="wb-full">${full} <span class="wex__ipa">${sentenceIPA(full)}</span> ${this._audioBtn(full)}</div>
                <div class="wb-ex">${q.explain}</div>
              </div>`; })}
          </div>`)}
        </div>`:html`<p class="ok">全对,没有错题!</p>`}
        <div class="btnrow"><button class="btn btn--primary" @click=${()=>{this.examStage='intro';}}>返回</button></div>
      </section>`;
    }
    // run
    const q=this._examFlat[this.examIdx]; const answered=Object.keys(this.examAnswers).length;
    const parts=String(q.q).split('___');
    return html`<section class="card">
      <div class="quiz-hd">
        <div class="progress"><span style="width:${Math.round(answered/total*100)}%"></span></div>
        <div class="quiz-meta"><span>摸底测试 · 单项选择</span><span>已答 ${answered}/${total}</span></div>
      </div>
      <div class="exam-q">
        <span class="exam-no">${this.examIdx+1}.</span>
        <span class="stem-clz">${parts[0]}<span class="blank"></span>${parts[1]||''}</span>
      </div>
      ${q.zh?html`<div class="qzh">${q.zh}</div>`:''}
      <div class="opts">
        ${q.options.map(op=>{ const sel=this.examAnswers[this.examIdx]===op; return html`<button class="opt ${sel?'opt--sel':''}" @click=${()=>this.chooseExam(op)}>${op}</button>`; })}
      </div>
      <div class="exam-nav">
        <button class="btn btn--ghost sm" ?disabled=${this.examIdx===0} @click=${()=>this.gotoExam(this.examIdx-1)}>上一题</button>
        <button class="btn btn--ghost sm" ?disabled=${this.examIdx===total-1} @click=${()=>this.gotoExam(this.examIdx+1)}>下一题</button>
        <button class="btn btn--primary sm" @click=${()=>this.submitExam()}>${ico('ic-check-circle-2')} 交卷</button>
      </div>
      <div class="sheet">
        <div class="sheet__t">答题卡</div>
        <div class="sheet__grid">
          ${this._examFlat.map((_,i)=>{ const done=this.examAnswers[i]!==undefined; const cur=i===this.examIdx;
            return html`<button class="cell ${done?'cell--done':''} ${cur?'cell--cur':''}" @click=${()=>this.gotoExam(i)}>${i+1}</button>`; })}
        </div>
      </div>
    </section>`;
  }

  // ---- util ----
  _shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
}
if (typeof customElements !== 'undefined') customElements.define('topic-app', TopicApp);

</script>
</body>
</html>
