<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>小学英语摸底测试（200题）</title>
  <style>
    :root{
      --brand:#2563eb;
      --brand-2:#1d4ed8;
      --brand-soft:#eef4ff;
      --brand-line:#bfd2ff;
      --ok:#117a37;
      --ok-soft:#edf9f1;
      --warn:#b85a00;
      --warn-soft:#fff5e8;
      --danger:#c53b2b;
      --danger-soft:#fff0ee;
      --text:#1f2937;
      --text-2:#5b6472;
      --bg:#f5f7fb;
      --surface:#ffffff;
      --line:#dbe2ea;
      --line-2:#ebf0f5;
      --shadow:0 12px 32px rgba(15,23,42,.08);
      --shadow-sm:0 6px 16px rgba(15,23,42,.06);
      --r-xl:24px;
      --r-lg:18px;
      --r-md:14px;
      --r-sm:10px;
      --wrap:min(1180px, calc(100vw - 32px));
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      color:var(--text);
      background:linear-gradient(180deg,#f7f9fc 0%, #f4f7fb 240px, #f5f7fb 100%);
    }
    button,input,select,textarea{font:inherit}
    .wrap{width:var(--wrap);margin:0 auto}
    .appbar{
      position:sticky;top:0;z-index:60;
      backdrop-filter:saturate(150%) blur(12px);
      background:rgba(245,247,251,.84);
      border-bottom:1px solid rgba(219,226,234,.9);
    }
    .appbar__inner{display:flex;align-items:center;gap:16px;justify-content:space-between;padding:14px 0}
    .brand{min-width:0}
    .brand__title{font-size:22px;font-weight:800;letter-spacing:.2px}
    .brand__sub{font-size:13px;color:var(--text-2);margin-top:4px}
    .appbar__meta{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
    .pill{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);font-size:13px;color:var(--text-2)}
    main{padding:24px 0 36px}
    .hero{display:grid;grid-template-columns:1.4fr .9fr;gap:18px;align-items:stretch}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow);padding:22px}
    .hero__title{font-size:34px;line-height:1.2;font-weight:900;margin:0 0 10px}
    .hero__desc{font-size:15px;line-height:1.8;color:var(--text-2);margin:0}
    .meta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
    .metric{background:linear-gradient(180deg,#ffffff,#f8fbff);border:1px solid var(--line-2);border-radius:18px;padding:16px}
    .metric__k{font-size:12px;color:var(--text-2);margin-bottom:8px}
    .metric__v{font-size:28px;font-weight:900;color:var(--brand)}
    .metric__s{font-size:12px;color:var(--text-2);margin-top:4px}
    .hero__aside{display:flex;flex-direction:column;gap:14px}
    .hero__aside .card{height:100%}
    .panel-title{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:18px;font-weight:800;margin-bottom:12px}
    .board-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .board-chip{padding:12px 14px;border-radius:16px;background:#fafcff;border:1px solid var(--line-2)}
    .board-chip__name{font-weight:800;font-size:14px;margin-bottom:4px}
    .board-chip__meta{font-size:12px;color:var(--text-2);line-height:1.6}
    .intro-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
    .btn{appearance:none;border:none;border-radius:14px;padding:12px 18px;font-weight:800;cursor:pointer;transition:.18s ease;background:#eef2f7;color:var(--text);border:1px solid transparent}
    .btn:hover{transform:translateY(-1px)}
    .btn--primary{background:var(--brand);color:#fff;box-shadow:0 10px 24px rgba(37,99,235,.22)}
    .btn--primary:hover{background:var(--brand-2);color:#fff}
    .btn--ghost{background:#fff;border-color:var(--line);color:var(--text)}
    .btn--danger{background:var(--danger-soft);color:var(--danger);border-color:#ffd3cc}
    .btn--wide{width:100%}
    .intro-note{font-size:13px;color:var(--text-2);line-height:1.7;margin-top:14px}

    .test-shell{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;align-items:start}
    .test-main{min-width:0}
    .test-topbar{position:sticky;top:74px;z-index:45;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:16px;backdrop-filter:blur(10px)}
    .test-topbar__row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .test-topbar__title{font-size:20px;font-weight:900}
    .test-topbar__meta{font-size:13px;color:var(--text-2)}
    .progress{height:10px;background:#edf2f7;border-radius:999px;overflow:hidden;margin-top:12px;border:1px solid #e5ebf2}
    .progress__fill{height:100%;background:linear-gradient(90deg,var(--brand),#60a5fa);border-radius:999px}
    .question-card{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-sm);padding:18px;margin-bottom:14px;scroll-margin-top:148px}
    .q-no{flex:none;width:38px;height:38px;border-radius:999px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:900}
    .q-main{flex:1;min-width:0}
    .q-stem{font-size:22px;line-height:1.8;font-weight:800;word-break:break-word}
    .blank{display:inline-flex;align-items:flex-end;justify-content:center;min-width:108px;padding:0 8px .5px;border-bottom:2px solid var(--brand-line);color:var(--brand);margin:0 4px}
    .blank.is-filled{background:var(--brand-soft);border-radius:8px 8px 0 0}
    .q-note{font-size:13px;color:var(--text-2);margin-top:8px}
    .options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
    .option{padding:14px 14px;border-radius:16px;border:1px solid var(--line);background:#fff;text-align:left;color:var(--text);font-weight:700;cursor:pointer;transition:.16s ease}
    .option:hover{border-color:#bfcce0;background:#f8fbff}
    .option.is-picked{background:var(--brand-soft);border-color:#93b4ff;color:var(--brand-2);box-shadow:inset 0 0 0 1px rgba(37,99,235,.06)}
    .option__label{display:inline-flex;width:22px;color:var(--text-2)}
    .answer-sheet{position:sticky;top:148px;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:18px}
    .answer-sheet__title{font-size:18px;font-weight:900}
    .answer-sheet__sub{font-size:12px;color:var(--text-2);line-height:1.7;margin:6px 0 12px}
    .answer-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
    .cell{appearance:none;border:none;border-radius:12px;height:40px;background:#f3f6fb;border:1px solid transparent;font-weight:800;color:#5b6472;cursor:pointer}
    .cell:hover{background:#eaf2ff}
    .cell.is-done{background:var(--brand);color:#fff}
    .sheet-actions{display:flex;flex-direction:column;gap:10px;margin-top:14px}
    .legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .legend__item{font-size:12px;color:var(--text-2);background:#f8fafc;border:1px solid var(--line-2);padding:8px 10px;border-radius:999px}

    .result-hero{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-bottom:18px}
    .score-card{padding:24px;background:linear-gradient(180deg,#ffffff,#f7fbff)}
    .score-ring{display:inline-flex;align-items:center;justify-content:center;width:112px;height:112px;border-radius:999px;background:radial-gradient(circle at 50% 45%,#fff 0,#fff 49%,transparent 50%),conic-gradient(var(--brand) var(--score-deg),#eaf0f7 0);border:1px solid var(--line);font-size:26px;font-weight:900;color:var(--brand)}
    .score-main{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
    .score-meta__title{font-size:30px;font-weight:900;margin:0 0 6px}
    .score-meta__desc{font-size:14px;color:var(--text-2);margin:0;line-height:1.7}
    .stat-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}
    .stat-card{padding:16px;border-radius:18px;border:1px solid var(--line-2);background:#fff}
    .stat-card__k{font-size:12px;color:var(--text-2);margin-bottom:8px}
    .stat-card__v{font-size:28px;font-weight:900}
    .stat-card.ok .stat-card__v{color:var(--ok)}
    .stat-card.warn .stat-card__v{color:var(--warn)}
    .stat-card.danger .stat-card__v{color:var(--danger)}
    .result-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
    .summary-list{display:flex;flex-direction:column;gap:12px}
    .summary-item{padding:14px 16px;border-radius:18px;border:1px solid var(--line-2);background:#fff}
    .summary-item__title{font-size:15px;font-weight:900;margin-bottom:6px}
    .summary-item__desc{font-size:13px;color:var(--text-2);line-height:1.7}
    .board-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:18px}
    .board-card{padding:18px;border-radius:20px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow-sm)}
    .board-card__head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px}
    .board-card__name{font-size:17px;font-weight:900}
    .badge{display:inline-flex;align-items:center;padding:8px 10px;border-radius:999px;font-size:12px;font-weight:800}
    .badge.strong{background:var(--ok-soft);color:var(--ok)}
    .badge.mid{background:var(--warn-soft);color:var(--warn)}
    .badge.weak{background:var(--danger-soft);color:var(--danger)}
    .board-card__meta{font-size:13px;color:var(--text-2);line-height:1.75}
    .mini-bar{height:8px;background:#edf2f7;border-radius:999px;overflow:hidden;border:1px solid #e5ebf2;margin:10px 0 8px}
    .mini-bar__fill{height:100%;background:linear-gradient(90deg,var(--brand),#60a5fa)}
    .wrong-groups{display:grid;gap:16px}
    .wrong-group{padding:20px;border-radius:22px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow-sm)}
    .wrong-group__head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
    .wrong-group__title{font-size:18px;font-weight:900}
    .wrong-item{padding:14px 0;border-top:1px dashed #e6edf5}
    .wrong-item:first-of-type{border-top:none;padding-top:0}
    .wrong-item__stem{font-size:16px;font-weight:800;line-height:1.7}
    .wrong-item__meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
    .tag{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800}
    .tag.correct{background:var(--ok-soft);color:var(--ok)}
    .tag.wrong{background:var(--danger-soft);color:var(--danger)}
    .wrong-item__explain{font-size:13px;color:var(--text-2);line-height:1.7;margin-top:8px}
    .section-title{font-size:24px;font-weight:900;margin:0 0 14px}
    .empty{padding:26px;border-radius:22px;border:1px dashed #bfd2ff;background:#f8fbff;color:#325aab;font-weight:700}
    .footer-note{font-size:12px;color:var(--text-2);margin-top:22px;line-height:1.7}

    @media (max-width: 980px){
      .hero,.result-hero,.test-shell{grid-template-columns:1fr}
      .answer-sheet{position:static}
      .test-topbar{top:68px}
      .board-grid{grid-template-columns:1fr}
      .board-list{grid-template-columns:1fr 1fr}
      .stat-row{grid-template-columns:repeat(2,1fr)}
    }
    @media (max-width: 720px){
      .wrap{width:min(100vw - 20px, 1180px)}
      .appbar__inner{align-items:flex-start;flex-direction:column}
      .appbar__meta{justify-content:flex-start}
      main{padding-top:16px}
      .hero__title{font-size:28px}
      .meta-grid,.stat-row{grid-template-columns:1fr 1fr}
      .options{grid-template-columns:1fr}
      .board-list{grid-template-columns:1fr}
      .test-topbar{top:92px}
      .question-card{padding:16px}
      .q-stem{font-size:20px}
    }
    @media (max-width: 420px){
      .meta-grid,.stat-row{grid-template-columns:1fr}
      .answer-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
      .q-stem{font-size:18px}
      .blank{min-width:92px}
    }
  
    .q-head{display:flex;align-items:flex-start;gap:14px}
    .q-head .q-main{flex:1;min-width:0}
    .audio-btn{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:1px solid var(--brand-soft);background:#fff;color:var(--brand);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all .18s;font-size:18px;margin-top:2px}
    .audio-btn:hover{background:var(--brand);color:#fff;border-color:var(--brand);transform:scale(1.05)}
    .audio-btn.playing{background:var(--brand);color:#fff;border-color:var(--brand);animation:pulse 1.1s infinite}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.45)}50%{box-shadow:0 0 0 6px rgba(37,99,235,0)}}
    .q-ipa{font-size:14px;color:var(--text-2);font-family:'Segoe UI',Verdana,sans-serif;margin-top:8px;line-height:1.6;letter-spacing:.2px}
    .q-ipa .ipa-tok{display:inline-block;margin-right:6px;color:#5b6b85}
    .rate-seg{display:inline-flex;background:#eef3fd;border-radius:999px;padding:3px;gap:2px;margin-left:12px}
    .rate-seg__btn{border:0;background:transparent;color:var(--text-2);padding:4px 12px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600}
    .rate-seg__btn.is-active{background:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.3)}
    .topbar-aux{display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:13px}
    @media (max-width:720px){ .audio-btn{width:36px;height:36px;font-size:16px} .q-ipa{font-size:13px} }

</style>
</head>

(function(){

// ================= TTS: Microsoft Edge Neural TTS (browser WebSocket) =================
// Real neural voice (en-US-AriaNeural). Runs fully in the browser via the same
// wss endpoint Edge uses — no backend. Falls back to Web Speech TTS if the socket
// fails (offline / blocked network). Single-file & offline-capable is preserved:
// online → 真人级发音; offline → 系统语音兜底.
const EDGE_VOICE = 'en-US-AriaNeural';
const EDGE_TRUSTED_TOKEN = '6A5AA1D4EAFF4E9FB37E23D68491D6F4';
const EDGE_WSS = 'wss://speech.platform.bing.com/consumer/speech/synthesize/readaloud/edge/v1?TrustedClientToken=' + EDGE_TRUSTED_TOKEN;

let _edgeBlocked = false;              // once we know it fails, stop retrying → go local
const _edgeCache = new Map();          // "rate|text" → objectURL (avoid re-synth)

// speech rate: shared by Edge TTS (SSML rate %) and local TTS (utterance.rate)
const RATE_LEVELS = {
  slow:   { ssml: '-35%', local: 0.65, label: '慢' },
  normal: { ssml: '-8%',  local: 0.85, label: '正常' },
  fast:   { ssml: '+15%', local: 1.05, label: '快' }
};
let _rate = 'normal';

function _uuid(){ return 'xxxxxxxxxxxx4xxxyxxxxxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16); }); }
function _dateStr(){ return new Date().toString().replace(/GMT.*/, 'GMT+0000 (Coordinated Universal Time)'); }
function _ssml(text){
  const esc = String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const rate = (RATE_LEVELS[_rate] || RATE_LEVELS.normal).ssml;
  return `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xml:lang='en-US'>`
    + `<voice name='${EDGE_VOICE}'><prosody rate='${rate}' pitch='+0Hz'>${esc}</prosody></voice></speak>`;
}

// ---- persistent WebSocket (reused across requests to avoid per-call handshake latency) ----
let _ws = null, _wsReady = null;
const _pending = new Map();   // requestId → { chunks, resolve, reject, timer }

function _connect(){
  if (_wsReady) return _wsReady;
  _wsReady = new Promise((resolve, reject) => {
    let ws;
    try { ws = new WebSocket(EDGE_WSS); } catch(e){ _wsReady = null; return reject(e); }
    ws.binaryType = 'arraybuffer';
    const openTimer = setTimeout(() => { try{ws.close();}catch(e){} _wsReady=null; reject(new Error('open timeout')); }, 6000);
    ws.onopen = () => {
      clearTimeout(openTimer);
      ws.send(
        `X-Timestamp:${_dateStr()}\r\nContent-Type:application/json; charset=utf-8\r\nPath:speech.config\r\n\r\n`
        + `{"context":{"synthesis":{"audio":{"metadataoptions":{"sentenceBoundaryEnabled":"false","wordBoundaryEnabled":"false"},"outputFormat":"audio-24khz-48kbitrate-mono-mp3"}}}}`
      );
      _ws = ws; resolve(ws);
    };
    ws.onmessage = (ev) => {
      if (typeof ev.data === 'string') {
        // header text frames carry X-RequestId; route by it
        const m = ev.data.match(/X-RequestId:([0-9a-f]+)/i);
        const id = m && m[1];
        if (ev.data.includes('Path:turn.end') && id && _pending.has(id)) {
          const st = _pending.get(id); _pending.delete(id); clearTimeout(st.timer);
          if (!st.chunks.length) return st.reject(new Error('no audio'));
          st.resolve(URL.createObjectURL(new Blob(st.chunks, { type: 'audio/mpeg' })));
        }
      } else {
        const buf = new Uint8Array(ev.data);
        // audio binary frame: parse X-RequestId from its text header
        const headerLen = (buf[0] << 8) | buf[1];
        const header = new TextDecoder().decode(buf.slice(2, 2 + headerLen));
        const m = header.match(/X-RequestId:([0-9a-f]+)/i);
        const id = m && m[1];
        const audio = buf.slice(2 + headerLen);
        if (id && _pending.has(id) && audio.length) _pending.get(id).chunks.push(audio);
      }
    };
    const drop = () => { _ws = null; _wsReady = null; _pending.forEach(st => { clearTimeout(st.timer); st.reject(new Error('ws closed')); }); _pending.clear(); };
    ws.onerror = drop; ws.onclose = drop;
  });
  return _wsReady;
}

// Synthesize via the shared WSS connection, resolve to an audio object URL (mp3).
function _edgeSynth(text){
  return _connect().then(ws => new Promise((resolve, reject) => {
    const id = _uuid().replace(/-/g,'').toUpperCase();
    const timer = setTimeout(() => { if (_pending.has(id)) { _pending.delete(id); reject(new Error('timeout')); } }, 5000);
    _pending.set(id, { chunks: [], resolve, reject, timer });
    try {
      ws.send(
        `X-RequestId:${id}\r\nContent-Type:application/ssml+xml\r\nX-Timestamp:${_dateStr()}Z\r\nPath:ssml\r\n\r\n`
        + _ssml(text)
      );
    } catch(e){ _pending.delete(id); clearTimeout(timer); reject(e); }
  }));
}

// prewarm: synthesize all page sentences in the background so clicks are instant
function _prewarm(sentences){
  if (_edgeBlocked) return;
  let i = 0;
  const step = () => {
    if (i >= sentences.length || _edgeBlocked) return;
    const text = sentences[i++];
    const key = _rate + '|' + text;
    if (_edgeCache.has(key)) { step(); return; }
    _edgeSynth(text).then(url => { _edgeCache.set(key, url); setTimeout(step, 60); })
                    .catch(() => { setTimeout(step, 60); });   // keep going even if one fails
  };
  // small initial delay so first paint isn't blocked
  setTimeout(step, 120);
}

function setRate(r){ if(RATE_LEVELS[r]){ _rate = r; _edgeCache.clear(); if (window.__allSentences) _prewarm(window.__allSentences); } }

function speak(text, btnEl){
  if (!text) return;
  if (btnEl) btnEl.classList.add('playing');
  const done = () => { if (btnEl) btnEl.classList.remove('playing'); };
  try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch(e){}
  if (!window.__ttsAudio) window.__ttsAudio = new Audio();
  const a = window.__ttsAudio;
  a.volume = 0.6;                 // default playback volume
  try { a.pause(); } catch(e){}

  const playUrl = (url) => {
    a.onended = done; a.onerror = () => _localSpeak(text, btnEl);
    a.src = url; const p = a.play(); if (p && p.catch) p.catch(() => _localSpeak(text, btnEl));
  };

  if (_edgeBlocked) { _localSpeak(text, btnEl); return; }
  const cacheKey = _rate + '|' + text;
  if (_edgeCache.has(cacheKey)) { playUrl(_edgeCache.get(cacheKey)); return; }

  // 抢答式:450ms 内 Edge 没返回就先用系统语音发声,Edge 结果照常回填缓存供下次秒响
  let settled = false;
  const grace = setTimeout(() => { if (settled) return; settled = true; _localSpeak(text, btnEl); }, 450);
  _edgeSynth(text).then(url => {
    _edgeCache.set(cacheKey, url);
    if (settled) return;
    settled = true; clearTimeout(grace); playUrl(url);
  }).catch(() => {
    if (settled) { _edgeBlocked = true; return; }
    settled = true; clearTimeout(grace); _edgeBlocked = true; _localSpeak(text, btnEl);
  });
}

// ---------- Local fallback: best available Web Speech voice ----------
let _voices = [], _bestVoice = null;
function _pickVoice(){
  try { _voices = window.speechSynthesis.getVoices() || []; } catch(e){ _voices = []; }
  if (!_voices.length) return null;
  const en = _voices.filter(v => /^en(-|_)/i.test(v.lang) || /english/i.test(v.name));
  if (!en.length) { _bestVoice = _voices[0]; return _bestVoice; }
  const score = (v) => { const n=(v.name||'').toLowerCase(); let s=0;
    if(/natural|neural|online|wavenet|premium|enhanced/.test(n)) s+=50;
    if(/google/.test(n)) s+=30; if(/microsoft|aria|jenny|guy|libby|sonia/.test(n)) s+=28;
    if(/samantha|karen|daniel|serena|moira/.test(n)) s+=20;
    if(/^en-us/i.test(v.lang)) s+=12; else if(/^en-gb/i.test(v.lang)) s+=10; else s+=4;
    if(v.localService===false) s+=8; return s; };
  en.sort((a,b)=>score(b)-score(a)); _bestVoice = en[0]; return _bestVoice;
}

function _localSpeak(text, btnEl){

    if (!('speechSynthesis' in window)) { if(btnEl) btnEl.classList.remove('playing'); return; }

    const v = _bestVoice || _pickVoice();
    if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'en-US'; }

  window.setRate = setRate;
  window.__getRate = () => _rate;

// ========== Sentence IPA helper ==========
window.sentenceIPA = function(sentence){
  const dict = window.IPA_DICT || {};
  return sentence.split(/\s+/).map(tok => {
    const clean = tok.toLowerCase().replace(/[^a-z0-9']/g,'');
    if (!clean) return '';
    const ipa = dict[clean];
    return ipa ? '<span class="ipa-tok">' + ipa + '</span>' : '';
  }).filter(Boolean).join(' ');
};
window.fullSentence = function(stem, answer){

//   blankSentenceTTS → 给 TTS 用，把空读成 "blank"，提示学生这里是空。
window.blankSentence = function(stem){
  return stem.replace('___', '').replace(/\s+/g,' ').trim();
};
window.blankSentenceTTS = function(stem){
  return stem.replace('___', 'blank').replace(/\s+/g,' ').trim();
};

<script>
    (function(){
      const DATA = JSON.parse(document.getElementById('placement-data').textContent);
      const appEl = document.getElementById('app');
      const byId = Object.fromEntries(DATA.questions.map(q => [q.id, q]));
      const byBoard = Object.fromEntries(DATA.boards.map(b => [b.id, b]));
      const state = { stage: 'intro', order: [], answers: {} };
      const letters = ['A', 'B', 'C', 'D'];

      function escapeHtml(str){
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function shuffle(arr){
        const out = arr.slice();
        for(let i = out.length - 1; i > 0; i--){
          const j = Math.floor(Math.random() * (i + 1));
          [out[i], out[j]] = [out[j], out[i]];
        }
        return out;
      }

      function orderedQuestions(){
        return state.order.map(id => byId[id]).filter(Boolean);
      }

      function save(){
        try{
          if(state.stage === 'intro'){
            localStorage.removeItem(DATA.storageKey);
            return;
          }
          localStorage.setItem(DATA.storageKey, JSON.stringify({
            stage: state.stage,
            order: state.order,
            answers: state.answers,
          }));
        }catch(err){}
      }

      function restore(){
        try{
          const raw = localStorage.getItem(DATA.storageKey);
          if(!raw) return false;
          const parsed = JSON.parse(raw);
          if(!parsed || !Array.isArray(parsed.order)) return false;
          const valid = parsed.order.every(id => byId[id]);
          if(!valid || parsed.order.length !== DATA.questions.length) return false;
          state.stage = parsed.stage || 'test';
          state.order = parsed.order.slice();
          state.answers = parsed.answers || {};
          return true;
        }catch(err){
          return false;
        }
      }

      function startTest(){
        state.stage = 'test';
        state.order = shuffle(DATA.questions.map(q => q.id));
        state.answers = {};
        save();
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function resetTest(){
        if(window.confirm('确定重新测试吗？这会清空当前答题进度与成绩。')){
          state.stage = 'intro';
          state.order = [];
          state.answers = {};
          save();
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      }

      function pickAnswer(index, optionIndex){
        const qs = orderedQuestions();
        const q = qs[index];
        if(!q) return;
        state.answers[index] = q.options[optionIndex];
        save();
        render();
      }

      function submitTest(){
        state.stage = 'result';
        save();
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function showReview(){
        state.stage = 'review';
        save();
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function backToResult(){
        state.stage = 'result';
        save();
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function jumpToQuestion(index){
        const el = document.getElementById('q-' + index);
        if(el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      function scoreStats(){
        const qs = orderedQuestions();
        let correct = 0, wrong = 0, unanswered = 0;
        qs.forEach((q, i) => {
          const chosen = state.answers[i];
          if(chosen == null){ unanswered++; return; }
          if(chosen === q.answer) correct++; else wrong++;
        });
        const answered = correct + wrong;
        const accuracy = qs.length ? Math.round(correct / qs.length * 100) : 0;
        const progress = qs.length ? Math.round(answered / qs.length * 100) : 0;
        return { total: qs.length, correct, wrong, unanswered, answered, accuracy, progress };
      }

      function levelText(rate){
        if(rate >= 85) return ['牢固', 'strong'];
        if(rate >= 65) return ['一般', 'mid'];
        return ['薄弱', 'weak'];
      }

      function ratingText(acc){
        if(acc >= 90) return '掌握优秀';
        if(acc >= 75) return '掌握良好';
        if(acc >= 60) return '基本达标';
        return '需要加强';
      }

      function boardStats(){
        const rows = DATA.boards.map(board => ({
          ...board,
          total: 0,
          correct: 0,
          wrong: 0,
          unanswered: 0,
          accuracy: 0,
        }));
        const idxMap = Object.fromEntries(rows.map(r => [r.id, r]));
        orderedQuestions().forEach((q, i) => {
          const row = idxMap[q.board];
          if(!row) return;
          row.total += 1;
          const chosen = state.answers[i];
          if(chosen == null) row.unanswered += 1;
          else if(chosen === q.answer) row.correct += 1;
          else row.wrong += 1;
        });
        rows.forEach(row => {
          row.accuracy = row.total ? Math.round(row.correct / row.total * 100) : 0;
          const [label, cls] = levelText(row.accuracy);
          row.levelLabel = label;
          row.levelClass = cls;

        const map = {};
        orderedQuestions().forEach((q, i) => {

          if(!map[q.board]) map[q.board] = { board, items: [] };
          map[q.board].items.push({ index: i, q, chosen });

                      <div class="q-note">${escapeHtml(q.note)}</div>
                      <div class="options">
                        ${q.options.map((opt, oi) => `
                          <button class="option ${chosen === opt ? 'is-picked' : ''}" data-action="pick" data-index="${i}" data-option-index="${oi}">
                            <span class="option__label">${letters[oi]}.</span> ${escapeHtml(opt)}
                          </button>
                        `).join('')}
                      </div>
                    </div>
                  </article>
                `;
              }).join('')}
            </div>
            <aside class="answer-sheet">
              <div class="answer-sheet__title">答题卡</div>
              <div class="answer-sheet__sub">点数字可跳到对应题目；蓝底表示已作答。</div>
              <div class="answer-grid">
                ${qs.map((_, i) => `<button class="cell ${state.answers[i] != null ? 'is-done' : ''}" data-action="jump" data-index="${i}">${i + 1}</button>`).join('')}
              </div>
              <div class="legend">
                <span class="legend__item">总题数：${stats.total}</span>
                <span class="legend__item">已答：${stats.answered}</span>
                <span class="legend__item">未答：${stats.unanswered}</span>
              </div>
              <div class="sheet-actions">
                <button class="btn btn--primary btn--wide" data-action="submit">交卷判分</button>
                <button class="btn btn--ghost btn--wide" data-action="restart">重新测试</button>
              </div>
            </aside>
          </section>
        `;
      }

      function resultView(){
        const stats = scoreStats();
        const rows = boardStats();
        const groups = wrongGroups();
        const tips = advice();
        const scoreDeg = Math.max(0, Math.min(360, Math.round(stats.accuracy * 3.6)));
        return `
          <section class="result-hero">
            <div class="card score-card" style="--score-deg:${scoreDeg}deg">
              <div class="score-main">
                <div class="score-ring">${stats.accuracy}</div>
                <div class="score-meta">
                  <h2 class="score-meta__title">${ratingText(stats.accuracy)}</h2>
                  <p class="score-meta__desc">本次共答对 ${stats.correct} 题，答错 ${stats.wrong} 题，未答 ${stats.unanswered} 题。建议先补弱项，再做一次整卷复测，观察准确率是否稳定提升。</p>
                </div>
              </div>
              <div class="stat-row">
                <div class="stat-card ok"><div class="stat-card__k">正确</div><div class="stat-card__v">${stats.correct}</div></div>
                <div class="stat-card danger"><div class="stat-card__k">错误</div><div class="stat-card__v">${stats.wrong}</div></div>
                <div class="stat-card warn"><div class="stat-card__k">未答</div><div class="stat-card__v">${stats.unanswered}</div></div>
                <div class="stat-card"><div class="stat-card__k">总题数</div><div class="stat-card__v">${stats.total}</div></div>
              </div>
              <div class="result-actions">
                <button class="btn btn--primary" data-action="review">查看错题回看</button>
                <button class="btn btn--ghost" data-action="restart">重新测试</button>
              </div>
            </div>
            <div class="card">
              <div class="panel-title"><span>学习建议</span><span style="font-size:12px;color:var(--text-2)">按优先级输出</span></div>
              <div class="summary-list">
                ${tips.weak.length ? tips.weak.map(item => `
                  <div class="summary-item">
                    <div class="summary-item__title">优先补弱：${escapeHtml(item.name)}</div>
                    <div class="summary-item__desc">当前正确率 ${item.accuracy}% · ${escapeHtml(item.repair)}</div>
                  </div>
                `).join('') : `
                  <div class="summary-item">
                    <div class="summary-item__title">整体基础较稳</div>
                    <div class="summary-item__desc">目前没有明显薄弱板块，可继续通过整卷复测巩固稳定性。</div>
                  </div>
                `}
                ${tips.mid.length ? tips.mid.slice(0,2).map(item => `
                  <div class="summary-item">
                    <div class="summary-item__title">继续巩固：${escapeHtml(item.name)}</div>
                    <div class="summary-item__desc">当前正确率 ${item.accuracy}% · 建议用错题再练 + 同类题复现的方式加固。</div>
                  </div>
                `).join('') : ''}
                ${tips.strong.length ? `
                  <div class="summary-item">
                    <div class="summary-item__title">已较稳板块</div>
                    <div class="summary-item__desc">${tips.strong.map(item => `${item.name}（${item.accuracy}%）`).join('、')}。保持每周一次快测即可。</div>
                  </div>
                ` : ''}
              </div>
            </div>
          </section>

          <section class="card" style="margin-bottom:18px">
            <h3 class="section-title">分板块掌握情况</h3>
            <div class="board-grid">
              ${rows.map(row => `
                <div class="board-card">
                  <div class="board-card__head">
                    <div class="board-card__name">${escapeHtml(row.name)}</div>
                    <span class="badge ${row.levelClass}">${row.levelLabel}</span>
                  </div>
                  <div class="mini-bar"><div class="mini-bar__fill" style="width:${row.accuracy}%"></div></div>
                  <div class="board-card__meta">正确率 ${row.accuracy}% · 正确 ${row.correct} / ${row.total}<br />${escapeHtml(row.focus)}</div>
                </div>
              `).join('')}
            </div>
          </section>

          <section class="card">
            <h3 class="section-title">错题分组</h3>
            ${groups.length ? `<div class="wrong-groups">${groups.map(group => `
              <div class="wrong-group">
                <div class="wrong-group__head">
                  <div class="wrong-group__title">${escapeHtml(group.board.name)}</div>
                  <span class="badge weak">${group.items.length} 题待回看</span>
                </div>
                ${group.items.map(item => `
                  <div class="wrong-item">
                    <div class="wrong-item__stem">${item.index + 1}. ${renderStem(item.q.stem, item.chosen)}</div>
                    <div style="display:flex;align-items:center;gap:10px;margin:6px 0"><button class="audio-btn" data-action="play" data-sentence="${escapeHtml(window.fullSentence(item.q.stem, item.q.answer))}" aria-label="朗读">▶</button><div class="q-ipa" style="margin:0;flex:1">${window.sentenceIPA(window.fullSentence(item.q.stem, item.q.answer))}</div></div>
                    <div class="wrong-item__meta">
                      <span class="tag wrong">你的答案：${escapeHtml(item.chosen)}</span>
                      <span class="tag correct">正确答案：${escapeHtml(item.q.answer)}</span>
                    </div>
                    <div class="wrong-item__explain">${escapeHtml(item.q.explain)}</div>
                  </div>
                `).join('')}
              </div>
            `).join('')}</div>` : `<div class="empty">恭喜你，本次没有错题。可以直接重新测试，检查是否能稳定保持高正确率。</div>`}
            <div class="footer-note">提示：结果页会保留刷新状态；重新测试后会清空当前题序与答案，并生成一份新的整卷。</div>
          </section>
        `;
      }

      function reviewView(){
        const groups = wrongGroups();
        return `
          <section class="card" style="margin-bottom:18px">
            <div class="panel-title"><span>错题回看</span><span style="font-size:12px;color:var(--text-2)">按板块分组</span></div>
            <div class="result-actions">
              <button class="btn btn--primary" data-action="back-result">返回成绩页</button>
              <button class="btn btn--ghost" data-action="restart">重新测试</button>
            </div>
          </section>
          <section class="card">
            ${groups.length ? `<div class="wrong-groups">${groups.map(group => `
              <div class="wrong-group">
                <div class="wrong-group__head">
                  <div class="wrong-group__title">${escapeHtml(group.board.name)}</div>
                  <span class="badge weak">${group.items.length} 题</span>
                </div>
                ${group.items.map(item => `
                  <div class="wrong-item">
                    <div class="wrong-item__stem">${item.index + 1}. ${renderStem(item.q.stem, item.chosen)}</div>
                    <div style="display:flex;align-items:center;gap:10px;margin:6px 0"><button class="audio-btn" data-action="play" data-sentence="${escapeHtml(window.fullSentence(item.q.stem, item.q.answer))}" aria-label="朗读">▶</button><div class="q-ipa" style="margin:0;flex:1">${window.sentenceIPA(window.fullSentence(item.q.stem, item.q.answer))}</div></div>
                    <div class="wrong-item__meta">
                      <span class="tag wrong">你的答案：${escapeHtml(item.chosen)}</span>
                      <span class="tag correct">正确答案：${escapeHtml(item.q.answer)}</span>
                    </div>
                    <div class="wrong-item__explain">${escapeHtml(item.q.explain)}</div>
                  </div>
                `).join('')}
              </div>
            `).join('')}</div>` : `<div class="empty">本次测试没有错题，继续保持。</div>`}
          </section>
        `;
      }

      function render(){
        let html = '';
        if(state.stage === 'intro') html = introView();
        else if(state.stage === 'test') html = testView();
        else if(state.stage === 'result') html = resultView();
        else if(state.stage === 'review') html = reviewView();
        appEl.innerHTML = html;
      }

      appEl.addEventListener('click', function(event){
        const rb = event.target.closest('.rate-seg__btn');
        if(rb){ const r=rb.getAttribute('data-rate'); window.setRate(r); document.querySelectorAll('.rate-seg__btn').forEach(b=>b.classList.toggle('is-active', b.getAttribute('data-rate')===r)); return; }
        const btn = event.target.closest('[data-action]');
        if(!btn) return;
        const action = btn.getAttribute('data-action');
        if(action === 'play'){ const s = btn.getAttribute('data-sentence') || ''; try{ window.speak(s, btn); }catch(e){} return; }
        if(action === 'start') startTest();
        else if(action === 'restart') resetTest();
        else if(action === 'submit') submitTest();
        else if(action === 'review') showReview();
        else if(action === 'back-result') backToResult();
        else if(action === 'jump') jumpToQuestion(Number(btn.getAttribute('data-index')));
        else if(action === 'pick') pickAnswer(Number(btn.getAttribute('data-index')), Number(btn.getAttribute('data-option-index')));
      });

      restore();
      render();
      document.documentElement.setAttribute('data-ready', '1');
    })();
  </script>
</body>
</html>
