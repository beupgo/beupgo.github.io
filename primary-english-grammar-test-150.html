<!DOCTYPE html>
<html lang="zh-CN" data-theme="">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小学英语综合语法测试 · 150 题</title>
<style>
/* =========================================================================
   AURORA DESIGN SYSTEM · tokens.css · v2.0
   Three-tier token architecture
     TIER 1  GLOBAL / PRIMITIVE  --g-*   raw values, theme-agnostic
     TIER 2  SEMANTIC / ALIAS    --s-*   roles, light/dark aware
     TIER 3  COMPONENT           --c-*   per-component, reference tier 2
   Import this file, then drive the brand color via --brand-h / --brand-s.
   ========================================================================= */

/* ===================== GLOBAL RESET · box-sizing ===================== */
/* Enforce border-box on ALL elements so width/height always include
   padding + border. This is the W3C recommended default and matches
   every modern framework (Tailwind, Bootstrap 5, Arco Design, etc.).
   Must load BEFORE components.css so component dimensions are predictable. */
*, *::before, *::after { box-sizing: border-box; }
gc-*, gc-*::before, gc-*::after {
  margin: 0; padding: 0; border: 0;
  font: inherit; color: inherit; background: none;
  vertical-align: baseline; -webkit-tap-highlight-color: transparent;
}

/* ===================== TIER 1 · GLOBAL / PRIMITIVE ===================== */
:root {
  /* --- Brand hue (configurable at runtime) --- */
  --brand-h: 232;
  --brand-s: 84%;

  /* --- Primary tonal scale --- */
  --g-primary-50:  hsl(var(--brand-h), var(--brand-s), 97%);
  --g-primary-100: hsl(var(--brand-h), var(--brand-s), 93%);
  --g-primary-200: hsl(var(--brand-h), var(--brand-s), 86%);
  --g-primary-300: hsl(var(--brand-h), var(--brand-s), 76%);
  --g-primary-400: hsl(var(--brand-h), var(--brand-s), 66%);
  --g-primary-500: hsl(var(--brand-h), var(--brand-s), 56%);
  --g-primary-600: hsl(var(--brand-h), var(--brand-s), 48%);
  --g-primary-700: hsl(var(--brand-h), var(--brand-s), 40%);
  --g-primary-800: hsl(var(--brand-h), var(--brand-s), 32%);
  --g-primary-900: hsl(var(--brand-h), var(--brand-s), 24%);

  /* --- Neutral / gray scale --- */
  --g-neutral-0:   #ffffff;
  --g-neutral-50:  #f9fafb;
  --g-neutral-100: #f3f4f6;
  --g-neutral-200: #e5e7eb;
  --g-neutral-300: #d1d5db;
  --g-neutral-400: #9ca3af;
  --g-neutral-500: #6b7280;
  --g-neutral-600: #4b5563;
  --g-neutral-700: #374151;
  --g-neutral-800: #1f2937;
  --g-neutral-900: #111827;
  --g-neutral-950: #0d1117;

  /* --- Functional color scales --- */
  --g-green-500:#16a34a; --g-green-100:#dcfce7; --g-green-700:#15803d;
  --g-amber-500:#d97706; --g-amber-100:#fef3c7; --g-amber-700:#b45309;
  --g-red-500:#dc2626;   --g-red-100:#fee2e2;   --g-red-700:#b91c1c;
  --g-cyan-500:#0891b2;  --g-cyan-100:#cffafe;  --g-cyan-700:#0e7490;

  /* --- Spacing scale (4px base) --- */
  --g-sp-0:0; --g-sp-1:4px; --g-sp-2:8px; --g-sp-3:12px; --g-sp-4:16px;
  --g-sp-5:20px; --g-sp-6:24px; --g-sp-8:32px; --g-sp-10:40px; --g-sp-12:48px; --g-sp-16:64px;

  /* --- Radius --- */
  --g-r-xs:4px; --g-r-sm:6px; --g-r-md:8px; --g-r-lg:12px; --g-r-xl:16px; --g-r-full:999px;

  /* --- Border width --- */
  --g-bw-0:0; --g-bw-1:1px; --g-bw-2:2px; --g-bw-4:4px;

  /* --- Typography --- */
  --g-font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
  --g-font-mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --g-fs-xs:12px; --g-fs-sm:13px; --g-fs-base:14px; --g-fs-md:16px;
  --g-fs-lg:18px; --g-fs-xl:22px; --g-fs-2xl:28px; --g-fs-3xl:36px;
  --g-fw-regular:400; --g-fw-medium:500; --g-fw-semibold:600; --g-fw-bold:700;
  --g-lh-tight:1.3; --g-lh-base:1.6; --g-lh-loose:1.8;
  --g-ls-tight:-.01em; --g-ls-normal:0; --g-ls-wide:.05em;

  /* --- Motion --- */
  --g-dur-fast:120ms; --g-dur-base:160ms; --g-dur-slow:260ms;
  --g-ease:cubic-bezier(.4,0,.2,1);

  /* --- Z-index layers --- */
  --g-z-base:0; --g-z-sticky:100; --g-z-dropdown:1000;
  --g-z-overlay:1100; --g-z-modal:1200; --g-z-toast:1300; --g-z-tooltip:1400;

  /* --- Opacity --- */
  --g-op-disabled:.5; --g-op-hover:.08; --g-op-overlay:.5;

  /* --- Breakpoints --- */
  --g-bp-sm:640px; --g-bp-md:768px; --g-bp-lg:1024px; --g-bp-xl:1280px;
}

/* ===================== TIER 2 · SEMANTIC / ALIAS ===================== */
:root {
  /* brand roles */
  --s-brand:            var(--g-primary-600);
  --s-brand-hover:      var(--g-primary-700);
  --s-brand-active:     var(--g-primary-800);
  --s-brand-subtle:     var(--g-primary-50);
  --s-brand-subtle-2:   var(--g-primary-100);
  --s-on-brand:         #ffffff;

  /* surfaces & background */
  --s-bg:               #f6f7f9;
  --s-surface:          var(--g-neutral-0);
  --s-surface-raised:   var(--g-neutral-0);
  --s-surface-sunken:   var(--g-neutral-50);
  --s-surface-hover:    var(--g-neutral-100);

  /* text */
  --s-text:             var(--g-neutral-900);
  --s-text-secondary:   var(--g-neutral-600);
  --s-text-muted:       var(--g-neutral-400);
  --s-text-on-fill:     #ffffff;
  --s-text-link:        var(--s-brand);

  /* border */
  --s-border:           var(--g-neutral-200);
  --s-border-strong:    var(--g-neutral-300);
  --s-border-focus:     var(--s-brand);

  /* state · success */
  --s-success:          var(--g-green-500);
  --s-success-bg:       var(--g-green-100);
  --s-success-border:   var(--g-green-500);
  --s-success-text:     var(--g-green-700);
  /* state · warning */
  --s-warning:          var(--g-amber-500);
  --s-warning-bg:       var(--g-amber-100);
  --s-warning-border:   var(--g-amber-500);
  --s-warning-text:     var(--g-amber-700);
  /* state · danger */
  --s-danger:           var(--g-red-500);
  --s-danger-bg:        var(--g-red-100);
  --s-danger-border:    var(--g-red-500);
  --s-danger-text:      var(--g-red-700);
  --s-danger-hover:     var(--g-red-700);
  /* state · info */
  --s-info:             var(--g-cyan-500);
  --s-info-bg:          var(--g-cyan-100);
  --s-info-border:      var(--g-cyan-500);
  --s-info-text:        var(--g-cyan-700);

  /* elevation */
  --s-shadow-sm: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.10);
  --s-shadow-md: 0 4px 8px -2px rgba(16,24,40,.10), 0 2px 4px -2px rgba(16,24,40,.06);
  --s-shadow-lg: 0 12px 24px -6px rgba(16,24,40,.14), 0 4px 8px -4px rgba(16,24,40,.08);
  --s-shadow-focus: 0 0 0 3px hsl(var(--brand-h), var(--brand-s), 56% / .35);
  --s-shadow-focus-danger: 0 0 0 3px rgba(220,38,38,.30);

  /* shared transition */
  --s-transition: var(--g-dur-base) var(--g-ease);
}

/* dark theme overrides */
[data-theme="dark"] {
  --g-primary-50:  hsl(var(--brand-h), var(--brand-s), 18%);
  --g-primary-100: hsl(var(--brand-h), var(--brand-s), 22%);

  --s-brand:            var(--g-primary-500);
  --s-brand-hover:      var(--g-primary-400);
  --s-brand-active:     var(--g-primary-300);

  --s-bg:               var(--g-neutral-950);
  --s-surface:          #161b22;
  --s-surface-raised:   #161b22;
  --s-surface-sunken:   #1c2129;
  --s-surface-hover:    #21262d;

  --s-text:             #e6edf3;
  --s-text-secondary:   #9da7b3;
  --s-text-muted:       #6e7681;

  --s-border:           #2d333b;
  --s-border-strong:    #444c56;

  --s-success-bg:#052e16; --s-warning-bg:#451a03; --s-danger-bg:#450a0a; --s-info-bg:#083344;
  --s-success-text:#4ade80; --s-warning-text:#fbbf24; --s-danger-text:#f87171; --s-info-text:#22d3ee;

  --s-shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --s-shadow-md: 0 4px 12px rgba(0,0,0,.5);
  --s-shadow-lg: 0 16px 32px rgba(0,0,0,.6);
}

/* ===================== TIER 3 · COMPONENT ===================== */
:root {
  /* button — height-driven sizing (P3: mini/small/default/large = 24/28/32/36px) */
  --c-btn-primary-bg:        var(--s-brand);
  --c-btn-primary-bg-hover:  var(--s-brand-hover);
  --c-btn-primary-bg-active: var(--s-brand-active);
  --c-btn-primary-fg:        var(--s-on-brand);
  --c-btn-radius:            var(--g-r-md);
  --c-btn-font-weight:      var(--g-fw-semibold);
  --c-btn-h-mini:           24px;
  --c-btn-h-small:          28px;
  --c-btn-h-default:        32px;
  --c-btn-h-large:          36px;
  --c-btn-pad-x-mini:       var(--g-sp-2);   /* 8px  */
  --c-btn-pad-x-small:      var(--g-sp-3);   /* 12px */
  --c-btn-pad-x-default:    var(--g-sp-4);   /* 16px */
  --c-btn-pad-x-large:      var(--g-sp-5);   /* 20px */

  /* input */
  --c-input-bg:           var(--s-surface);
  --c-input-border:       var(--s-border-strong);
  --c-input-border-focus: var(--s-border-focus);
  --c-input-radius:       var(--g-r-md);
  --c-input-pad-y:        10px;
  --c-input-pad-x:        12px;

  /* card */
  --c-card-bg:      var(--s-surface);
  --c-card-border:  var(--s-border);
  --c-card-radius:  var(--g-r-lg);
  --c-card-shadow:  var(--s-shadow-sm);
  --c-card-pad:     var(--g-sp-6);

  /* overlay layering */
  --c-modal-z:    var(--g-z-modal);
  --c-overlay-z:  var(--g-z-overlay);
  --c-toast-z:    var(--g-z-toast);
  --c-tooltip-z:  var(--g-z-tooltip);
  --c-sticky-z:   var(--g-z-sticky);
  --c-modal-radius: var(--g-r-xl);
  --c-modal-max-w:  440px;

  /* table */
  --c-table-head-bg:   var(--s-surface-sunken);
  --c-table-row-hover: var(--s-surface-hover);
  --c-table-border:    var(--s-border);

  /* badge */
  --c-badge-bg:      var(--s-brand-subtle);
  --c-badge-fg:      var(--s-brand);
  --c-badge-radius:  var(--g-r-full);
  --c-badge-pad-y:   var(--g-sp-1);
  --c-badge-pad-x:   var(--g-sp-2);
  --c-badge-fs:      var(--g-fs-xs);
  --c-badge-fw:      var(--g-fw-semibold);

  /* alert */
  --c-alert-radius:  var(--g-r-md);
  --c-alert-pad-y:   var(--g-sp-3);
  --c-alert-pad-x:   var(--g-sp-4);
  --c-alert-border:  var(--g-bw-1);

  /* tabs */
  --c-tab-fg:            var(--s-text-secondary);
  --c-tab-fg-active:     var(--s-brand);
  --c-tab-indicator:     var(--s-brand);
  --c-tab-pad-y:         var(--g-sp-3);
  --c-tab-pad-x:         var(--g-sp-4);
  --c-tab-fw-active:     var(--g-fw-semibold);

  /* switch */
  --c-switch-off:    var(--s-border-strong);
  --c-switch-on:     var(--s-brand);
  --c-switch-knob:   var(--g-neutral-0);
  --c-switch-w:      40px;
  --c-switch-h:      22px;

  /* tooltip */
  --c-tooltip-bg:     var(--g-neutral-900);
  --c-tooltip-fg:     var(--g-neutral-0);
  --c-tooltip-radius: var(--g-r-sm);
  --c-tooltip-pad-y:  var(--g-sp-1);
  --c-tooltip-pad-x:  var(--g-sp-2);
  --c-tooltip-fs:     var(--g-fs-xs);

  /* progress */
  --c-progress-track: var(--s-surface-sunken);
  --c-progress-fill:  var(--s-brand);
  --c-progress-h:     8px;
  --c-progress-radius: var(--g-r-full);

  /* avatar */
  --c-avatar-bg:     var(--s-brand-subtle-2);
  --c-avatar-fg:     var(--s-brand);
  --c-avatar-radius: var(--g-r-full);
  --c-avatar-size:   40px;

  /* tag */
  --c-tag-bg:      var(--s-surface-sunken);
  --c-tag-fg:      var(--s-text-secondary);
  --c-tag-radius:  var(--g-r-sm);
  --c-tag-pad-y:   var(--g-sp-1);
  --c-tag-pad-x:   var(--g-sp-2);
  --c-tag-fs:      var(--g-fs-xs);

  /* control (checkbox / radio shared) */
  --c-control-border: var(--s-border-strong);
  --c-control-on:     var(--s-brand);

  /* dropdown / select popup layering */
  --c-dropdown-z:  var(--g-z-dropdown);

  /* select (Arco-aligned: sizes 24/28/32/36 = mini/small/default/large) */
  --c-select-bg:            var(--s-surface);
  --c-select-border:        var(--s-border-strong);
  --c-select-border-hover:  var(--s-brand);
  --c-select-border-focus:  var(--s-border-focus);
  --c-select-radius:        var(--g-r-md);
  --c-select-pad-x:         var(--g-sp-3);
  --c-select-fg:            var(--s-text);
  --c-select-placeholder:   var(--s-text-muted);
  --c-select-arrow:         var(--s-text-muted);
  --c-select-h-mini:        24px;
  --c-select-h-small:       28px;
  --c-select-h-default:     32px;
  --c-select-h-large:       36px;
  /* popup menu */
  --c-select-menu-bg:       var(--s-surface-raised);
  --c-select-menu-border:   var(--s-border);
  --c-select-menu-radius:   var(--g-r-md);
  --c-select-menu-shadow:   var(--s-shadow-md);
  --c-select-menu-pad:      var(--g-sp-1);
  /* option states */
  --c-select-opt-fg:           var(--s-text);
  --c-select-opt-bg-hover:     var(--s-surface-hover);
  --c-select-opt-bg-selected:  var(--s-brand-subtle);
  --c-select-opt-fg-selected:  var(--s-brand);
  --c-select-opt-radius:       var(--g-r-sm);
  --c-select-opt-pad-y:        var(--g-sp-2);
  --c-select-opt-pad-x:        var(--g-sp-3);
  /* multiple-mode tag chips (reuse tag roles) */
  --c-select-tag-bg:        var(--s-surface-sunken);
  --c-select-tag-fg:        var(--s-text-secondary);
  --c-select-tag-radius:    var(--g-r-sm);
  /* group label */
  --c-select-group-fg:      var(--s-text-muted);

  /* spinner */
  --c-spinner-size:  20px;
  --c-spinner-color: var(--s-brand);

  /* drawer */
  --c-drawer-size: 360px;
}

/* =========================================================================
   GENIUS DESIGN ICONS · icons.css · v1.0
   Token-driven SVG icon layer. Load AFTER genius-design-tokens' tokens.css so
   the semantic icon roles can reference --s-* and the spacing scale.

   Tiers (mirrors genius-design-tokens):
     TIER 1  GLOBAL      --g-icon-*   raw sizes + stroke
     TIER 2  SEMANTIC    --s-icon-*   color roles, light/dark aware
     TIER 3  COMPONENT   --c-icon-*   size each component should use
   Color rule:  icons paint with currentColor — set the PARENT's color.
   Size rule:   use .ico + a size class, or a --c-icon-* token. Never px-by-hand.
   ========================================================================= */

:root {
  /* ---------- TIER 1 · GLOBAL · raw icon sizes (snapped to 4px rhythm) ---------- */
  --g-icon-xs:  14px;   /* dense inline / table cell      */
  --g-icon-sm:  16px;   /* default inline next to text    */
  --g-icon-md:  20px;   /* buttons, list rows, inputs     */
  --g-icon-lg:  24px;   /* nav, section headers           */
  --g-icon-xl:  32px;   /* feature / card                 */
  --g-icon-2xl: 40px;   /* hero / empty-state             */
  --g-icon-3xl: 64px;   /* large empty-state / marketing  */

  --g-icon-stroke:      2;     /* default optical stroke for 24-grid icons */
  --g-icon-stroke-thin: 1.5;   /* large icons can use a thinner stroke     */

  /* ---------- motion scale (durations + easings, reused across animations) ----------
     Bridged to genius-design-tokens' global motion primitives so icon timing follows
     the SAME rhythm as the rest of the system; each carries a standalone fallback so
     icons.css still animates if tokens.css is absent. */
  --g-icon-dur-fast:   var(--g-dur-fast,  .4s);   /* snappy micro-interactions  */
  --g-icon-dur:        var(--g-dur-base,  .8s);   /* default loop speed         */
  --g-icon-dur-slow:   var(--g-dur-slow, 1.6s);   /* calm ambient motion        */
  --g-icon-ease:        var(--g-ease, cubic-bezier(.4, 0, .2, 1)); /* standard ease  */
  --g-icon-ease-bounce: cubic-bezier(.34, 1.56, .64, 1);/* overshoot/pop (icon-local) */
  --g-icon-ease-spin:   linear;                         /* steady rotation (icon-local) */
}

:root {
  /* ---------- TIER 2 · SEMANTIC · icon color roles (theme aware) ---------- */
  /* These reference genius-design-tokens semantic roles when present, with a
     safe fallback so icons.css also works standalone. */
  --s-icon-color:    var(--s-text,          #111827); /* default icon color   */
  --s-icon-muted:    var(--s-text-muted,     #9ca3af); /* secondary / disabled */
  --s-icon-brand:    var(--s-brand,          #4f46e5); /* emphasis / active    */
  --s-icon-on-brand: var(--s-on-brand,       #ffffff); /* on filled brand bg   */
  --s-icon-inverse:  var(--s-text-on-fill,   #ffffff); /* on dark fills        */
  --s-icon-success:  var(--s-success,        #16a34a);
  --s-icon-warning:  var(--s-warning,        #d97706);
  --s-icon-danger:   var(--s-danger,         #dc2626);
  --s-icon-info:     var(--s-info,           #0891b2);
}

:root {
  /* ---------- TIER 3 · COMPONENT · which size each context uses ---------- */
  --c-icon-inline:  var(--g-icon-sm);   /* icon sitting beside body text   */
  --c-icon-btn:     var(--g-icon-md);   /* inside a button                 */
  --c-icon-btn-sm:  var(--g-icon-sm);   /* inside a small/compact button   */
  --c-icon-input:   var(--g-icon-md);   /* input affix / search field      */
  --c-icon-nav:     var(--g-icon-lg);   /* sidebar / top nav               */
  --c-icon-table:   var(--g-icon-xs);   /* table action icons (dense)      */
  --c-icon-alert:   var(--g-icon-md);   /* alert / toast leading icon      */
  --c-icon-card:    var(--g-icon-xl);   /* feature card icon               */
  --c-icon-empty:   var(--g-icon-2xl);  /* empty-state illustration glyph  */
  --c-icon-hero:    var(--g-icon-3xl);  /* C-side hero / marketing glyph   */
}

/* ===================== BASE CLASS ===================== */
/* .ico defaults to 1em so an icon scales with the parent's font-size out of the
   box; size utilities and --c-icon-* override that with the token scale. */
.ico {
  display: inline-block;
  width: 1em;
  height: 1em;
  flex: none;                       /* never shrink in a flex row */
  vertical-align: -0.125em;         /* optical baseline alignment */
  fill: none;
  stroke: currentColor;             /* COLOR = parent's color     */
  stroke-width: var(--g-icon-stroke);
  stroke-linecap: round;
  stroke-linejoin: round;
  color: var(--s-icon-color);       /* default, overridable by parent */
}

/* ---------- size utilities (pin to the global size scale) ---------- */
.ico--xs  { width: var(--g-icon-xs);  height: var(--g-icon-xs);  }
.ico--sm  { width: var(--g-icon-sm);  height: var(--g-icon-sm);  }
.ico--md  { width: var(--g-icon-md);  height: var(--g-icon-md);  }
.ico--lg  { width: var(--g-icon-lg);  height: var(--g-icon-lg);  }
.ico--xl  { width: var(--g-icon-xl);  height: var(--g-icon-xl);  stroke-width: var(--g-icon-stroke-thin); }
.ico--2xl { width: var(--g-icon-2xl); height: var(--g-icon-2xl); stroke-width: var(--g-icon-stroke-thin); }
.ico--3xl { width: var(--g-icon-3xl); height: var(--g-icon-3xl); stroke-width: var(--g-icon-stroke-thin); }

/* The sprite's <symbol> carries stroke-width="2" as a presentation attribute so
   icons render even with a bare <use> (the attribute is inherited by the symbol
   geometry through the <use> shadow tree — a plain CSS stroke-width on .ico does
   NOT cross that boundary). To let the size utilities still re-thin large icons,
   re-assert stroke-width via the symbol selector, which wins over the attribute. */
.ico--xl  use, .ico--2xl use, .ico--3xl use { stroke-width: var(--g-icon-stroke-thin); }
.ico use { stroke-width: var(--g-icon-stroke); }

/* ---------- component-bound sizes (track a --c-icon-* token) ---------- */
.ico--inline { width: var(--c-icon-inline); height: var(--c-icon-inline); }
.ico--btn    { width: var(--c-icon-btn);    height: var(--c-icon-btn);    }
.ico--nav    { width: var(--c-icon-nav);    height: var(--c-icon-nav);    }
.ico--table  { width: var(--c-icon-table);  height: var(--c-icon-table);  }
.ico--card   { width: var(--c-icon-card);   height: var(--c-icon-card);   }
.ico--empty  { width: var(--c-icon-empty);  height: var(--c-icon-empty);  }

/* ---------- color roles (when you want to color the icon directly) ---------- */
.ico--muted   { color: var(--s-icon-muted);   }
.ico--brand   { color: var(--s-icon-brand);   }
.ico--success { color: var(--s-icon-success); }
.ico--warning { color: var(--s-icon-warning); }
.ico--danger  { color: var(--s-icon-danger);  }
.ico--info    { color: var(--s-icon-info);    }
.ico--on-brand{ color: var(--s-icon-on-brand);}

/* =====================================================================
   MOTION LAYER · token-driven icon animations
   All speeds come from --g-icon-dur* and easings from --g-icon-ease*, so a
   single token change re-times every animated icon. Geometry is never touched;
   only transforms / opacity / stroke-dash animate (GPU-friendly).

   Two ways to animate:
     1. Continuous loop  — add a class, e.g. <svg class="ico ico--spin">.
     2. Hover trigger    — wrap with .ico-hover and add .ico-hover--<name>;
        the icon animates once on hover (great for buttons / nav / cards).
   Override speed per-instance with a local token, e.g.
        <svg class="ico ico--spin" style="--g-icon-dur:.5s">.
   ===================================================================== */

.ico { transform-origin: 50% 50%; }

/* ---------- continuous loops ---------- */
.ico--spin   { animation: ico-spin   var(--g-icon-dur)      var(--g-icon-ease-spin) infinite; }
.ico--spin-slow { animation: ico-spin var(--g-icon-dur-slow) var(--g-icon-ease-spin) infinite; }
.ico--pulse  { animation: ico-pulse  var(--g-icon-dur-slow) var(--g-icon-ease)      infinite; }
.ico--ping   { animation: ico-ping   var(--g-icon-dur-slow) var(--g-icon-ease)      infinite; }
.ico--bounce { animation: ico-bounce var(--g-icon-dur)      var(--g-icon-ease)      infinite; }
.ico--beat   { animation: ico-beat   var(--g-icon-dur-slow) var(--g-icon-ease)      infinite; }
.ico--wobble { animation: ico-wobble var(--g-icon-dur)      var(--g-icon-ease)      infinite; }
.ico--shake  { animation: ico-shake  var(--g-icon-dur)      var(--g-icon-ease)      infinite; }
.ico--float  { animation: ico-float  var(--g-icon-dur-slow) var(--g-icon-ease)      infinite; }
.ico--swing  { animation: ico-swing  var(--g-icon-dur-slow) var(--g-icon-ease)      infinite; transform-origin: 50% 8%; }

@keyframes ico-spin   { to { transform: rotate(360deg); } }
@keyframes ico-pulse  { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes ico-ping   { 0% { transform: scale(1); opacity: 1; } 70%,100% { transform: scale(1.6); opacity: 0; } }
@keyframes ico-bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-22%); } }
@keyframes ico-beat   { 0%,100% { transform: scale(1); } 30% { transform: scale(1.22); } 60% { transform: scale(.95); } }
@keyframes ico-wobble { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-9deg); } 75% { transform: rotate(9deg); } }
@keyframes ico-shake  { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-2px); } 40% { transform: translateX(2px); } 60% { transform: translateX(-2px); } 80% { transform: translateX(2px); } }
@keyframes ico-float  { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12%); } }
@keyframes ico-swing  { 0%,100% { transform: rotate(0); } 25% { transform: rotate(12deg); } 75% { transform: rotate(-12deg); } }

/* ---------- one-shot reveal: stroke "draws itself in" ---------- */
/* The <use> path inherits these; works on any sprite icon. */
.ico--draw use, .ico--draw path, .ico--draw circle, .ico--draw rect,
.ico--draw line, .ico--draw polyline, .ico--draw polygon {
  stroke-dasharray: 64;
  stroke-dashoffset: 64;
  animation: ico-draw var(--g-icon-dur-slow) var(--g-icon-ease) forwards;
}
@keyframes ico-draw { to { stroke-dashoffset: 0; } }

/* ---------- hover-triggered micro-interactions ---------- */
/* Put .ico-hover on the interactive parent (button / link / cell); the icon
   plays its animation only while hovered, then settles. */
.ico-hover .ico { transition: transform var(--g-icon-dur-fast) var(--g-icon-ease); }
.ico-hover.ico-hover--grow:hover    .ico { transform: scale(1.18); }
.ico-hover.ico-hover--shrink:hover  .ico { transform: scale(.85); }
.ico-hover.ico-hover--rotate:hover  .ico { transform: rotate(90deg); }
.ico-hover.ico-hover--spin:hover    .ico { transform: rotate(360deg); }
.ico-hover.ico-hover--up:hover      .ico { transform: translateY(-3px); }
.ico-hover.ico-hover--right:hover   .ico { transform: translateX(3px); }
.ico-hover.ico-hover--pop:hover     .ico { transform: scale(1.2); transition-timing-function: var(--g-icon-ease-bounce); }
.ico-hover.ico-hover--wobble:hover  .ico { animation: ico-wobble var(--g-icon-dur) var(--g-icon-ease); }
.ico-hover.ico-hover--beat:hover    .ico { animation: ico-beat   var(--g-icon-dur) var(--g-icon-ease); }

/* ---------- accessibility: honor reduced-motion ---------- */
@media (prefers-reduced-motion: reduce) {
  .ico--spin, .ico--spin-slow, .ico--pulse, .ico--ping, .ico--bounce,
  .ico--beat, .ico--wobble, .ico--shake, .ico--float, .ico--swing,
  .ico--draw use, .ico--draw path, .ico--draw circle, .ico--draw rect,
  .ico--draw line, .ico--draw polyline, .ico--draw polygon,
  .ico-hover .ico {
    animation: none !important;
    transition: none !important;
    stroke-dashoffset: 0 !important;
  }
}

/* =========================================================================
   GENIUS DESIGN LAYOUT · layout-kit.css
   Token-driven layout layer. Companion to genius-design-tokens (tokens.css).
   Consumes --g-sp-* (8pt spacing), --g-bp-* (breakpoints), semantic/component
   color tokens. Sets NO brand color of its own — theming stays centralized.
   Import AFTER tokens.css.
   ========================================================================= */

/* ---- Layout-token layer (thin, references globals) ---- */
:root{
  /* container sizing — scenario-tiered, FLUID: grow with viewport up to a cap,
     so wide / ultrawide screens actually use the space instead of freezing the
     width and piling on side margins. min(vw, max) > a flat max-width. */
  --c-container-max:  min(92vw, 1280px);   /* C-side default                       */
  --c-container-wide: min(95vw, 2000px);   /* B-side / dashboard, near-full-bleed  */
  --c-container-read: 720px;    /* docs / article reading column (45-75ch) — stays narrow on purpose */
  /* fluid horizontal padding: grows with viewport, clamped for safety  */
  --c-container-pad:  clamp(var(--g-sp-4), 4vw, var(--g-sp-8));
  /* grid */
  --c-grid-cols: 12;
  --c-grid-gutter: clamp(var(--g-sp-3), 2vw, var(--g-sp-6));
  /* regions (app shell) */
  --c-sidebar-w: clamp(200px, 18vw, 260px);
  --c-topbar-h: 56px;
  /* section rhythm (C-side) — fluid vertical rhythm */
  --c-section-pad-y: clamp(var(--g-sp-8), 8vw, var(--g-sp-16));
  --c-card-pad: var(--g-sp-6);
}

/* Fallbacks so the kit also works standalone if tokens.css is absent.
   (When tokens.css is present, its values win because it is imported first
   and these @supports-free fallbacks only fill undeclared customs.) */
:root{
  --g-sp-1: var(--g-sp-1, 4px);
  --g-sp-2: var(--g-sp-2, 8px);
  --g-sp-3: var(--g-sp-3, 12px);
  --g-sp-4: var(--g-sp-4, 16px);
  --g-sp-6: var(--g-sp-6, 24px);
  --g-sp-8: var(--g-sp-8, 32px);
  --g-sp-16: var(--g-sp-16, 64px);
  --g-bp-sm: var(--g-bp-sm, 640px);
  --g-bp-md: var(--g-bp-md, 768px);
  --g-bp-lg: var(--g-bp-lg, 1024px);
  --g-bp-xl: var(--g-bp-xl, 1280px);
}

*,*::before,*::after{ box-sizing:border-box; }

/* ---- Container (scenario-tiered) ---- */
.container{
  width:100%;
  max-width:var(--c-container-max);
  margin-inline:auto;
  padding-inline:var(--c-container-pad);
}
.container--wide{   max-width:var(--c-container-wide); }   /* B-side / dashboard */
.container--narrow{ max-width:880px; }
.container--read{   max-width:var(--c-container-read); }   /* docs / article */
.reading{ max-width:var(--c-container-read); margin-inline:auto; }

/* ---- 12-column grid ---- */
.grid{
  display:grid;
  grid-template-columns:repeat(var(--c-grid-cols),1fr);
  gap:var(--c-grid-gutter);
}
.col-1{grid-column:span 1}.col-2{grid-column:span 2}.col-3{grid-column:span 3}
.col-4{grid-column:span 4}.col-5{grid-column:span 5}.col-6{grid-column:span 6}
.col-7{grid-column:span 7}.col-8{grid-column:span 8}.col-9{grid-column:span 9}
.col-10{grid-column:span 10}.col-11{grid-column:span 11}.col-12{grid-column:span 12}

/* ---- Auto card grid (list-feed archetype) ---- */
.card-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:var(--c-grid-gutter);
}

/* ---- Flex helpers ---- */
.stack{ display:flex; flex-direction:column; gap:var(--g-sp-4); }
.row{ display:flex; align-items:center; gap:var(--g-sp-3); }
.row--between{ display:flex; align-items:center; justify-content:space-between; gap:var(--g-sp-4); }
.wrap{ flex-wrap:wrap; }

/* =========================================================================
   ARCHETYPE SKELETONS
   ========================================================================= */

/* A. App Shell (B-side, data) ---------------------------------------- */
.app-shell{
  display:grid;
  grid-template-columns:var(--c-sidebar-w) 1fr;
  grid-template-rows:var(--c-topbar-h) 1fr;
  grid-template-areas:"sidebar topbar" "sidebar content";
  min-height:100vh;
}
.app-shell__sidebar{ grid-area:sidebar; padding:var(--g-sp-4); }
.app-shell__topbar{ grid-area:topbar; display:flex; align-items:center; gap:var(--g-sp-4); padding-inline:var(--g-sp-6); }
.app-shell__content{ grid-area:content; padding:var(--g-sp-6); overflow:auto; }

/* B. Two-pane / List-Detail (B-side, form) -------------------------- */
.two-pane{ display:grid; grid-template-columns:minmax(260px,1fr) 2fr; gap:var(--c-grid-gutter); min-height:100%; }
.two-pane__list{ padding:var(--g-sp-4); }
.two-pane__detail{ padding:var(--g-sp-6); }

/* C. Stacked Sections (C-side, marketing) --------------------------- */
.section{ padding-block:var(--c-section-pad-y); }
.section--tight{ padding-block:var(--g-sp-8); }
.section__head{ text-align:center; max-width:760px; margin-inline:auto; margin-bottom:var(--g-sp-8); }

/* D. Comparison Grid (C-side, pricing) ------------------------------ */
.compare{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--c-grid-gutter); align-items:stretch; }
.compare__col{ padding:var(--c-card-pad); display:flex; flex-direction:column; gap:var(--g-sp-4); }

/* E. Doc Layout (content, docs) ------------------------------------- */
.doc{ display:grid; grid-template-columns:240px minmax(0,1fr) 200px; gap:var(--c-grid-gutter); }
.doc__nav{ padding:var(--g-sp-4); }
.doc__main{ max-width:var(--c-container-read); }
.doc__toc{ padding:var(--g-sp-4); font-size:var(--g-fs-sm,13px); }

/* F. Card (icon + title same line — project rule) ------------------- */
.card{
  padding:var(--c-card-pad);
  border-radius:var(--c-card-radius,var(--g-r-lg,12px));
  background:var(--s-surface,#fff);
  border:1px solid var(--s-border,#e5e7eb);
  display:flex; flex-direction:column; gap:var(--g-sp-3);
}
.card__head{ display:flex; align-items:center; gap:var(--g-sp-3); }
.card__icon{ width:28px; height:28px; flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; }
.card__title{ font-weight:var(--g-fw-semibold,600); margin:0; }

/* =========================================================================
   ADAPTIVE STRATEGY — device-tier breakpoint ladder.
   Reflow (re-column), not scale. All breakpoints from --g-bp-* values.

   Device tiers:
     xs  < 640    phone (portrait)        -> 1 col, full-bleed, drawers
     sm  640-767  phone (landscape)/phab  -> 1-2 col
     md  768-1023 tablet                  -> 2 col, sidebar may collapse
     lg  1024-1279 laptop                 -> full grid, all regions
     xl  >= 1280  desktop / wide          -> full grid, wide container for B-side
   Approach: mobile-first base = 1 col; enhance upward at each tier.
   ========================================================================= */

/* xxl and up (>= 1680) — wide / 27" desktop: UP-tier reflow. A wider container
   alone is NOT a perceptible layout change; the GRID must re-column so the extra
   width becomes more columns, not just bigger margins. */
@media (min-width:1680px){           /* >= --g-bp-xxl */
  .kpis > .col-3{ grid-column:span 2; }            /* KPI row 4 -> 6 up      */
  .grid > .col-8{ grid-column:span 9; }            /* trend chart wider      */
  .grid > .col-4{ grid-column:span 3; }
  .card-grid{ grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); }
  .doc{ grid-template-columns:240px minmax(0,1fr) 240px; } /* wider rails    */
}

/* lg and below (< 1280) — tablet/laptop: trim 3-col chrome */
@media (max-width:1279px){           /* < --g-bp-xl */
  .doc{ grid-template-columns:220px minmax(0,1fr); }   /* drop right TOC */
  .doc__toc{ display:none; }
}
/* md and below (< 1024) — tablet: 2-col comparison, doc nav narrows */
@media (max-width:1023px){           /* < --g-bp-lg */
  .compare{ grid-template-columns:repeat(2,1fr); }
  .doc{ grid-template-columns:180px minmax(0,1fr); }
}
/* sm and below (< 768) — phone landscape / small tablet: regions stack */
@media (max-width:767px){            /* < --g-bp-md */
  .app-shell{
    grid-template-columns:1fr;
    grid-template-rows:var(--c-topbar-h) 1fr;
    grid-template-areas:"topbar" "content";
  }
  .app-shell__sidebar{ position:fixed; inset:0 auto 0 0; width:var(--c-sidebar-w);
    transform:translateX(-100%); transition:transform var(--g-dur-base,160ms) var(--g-ease,ease); z-index:1000; }
  .app-shell.is-open .app-shell__sidebar{ transform:none; }
  .two-pane{ grid-template-columns:1fr; }
  .doc{ grid-template-columns:1fr; }
  .doc__nav{ display:none; }
}
/* xs (< 640) — phone portrait: everything to a single column, tighter rhythm */
@media (max-width:639px){            /* < --g-bp-sm */
  .grid{ grid-template-columns:1fr; }
  .grid > [class*="col-"]{ grid-column:1 / -1; }
  .compare{ grid-template-columns:1fr; }
  .card-grid{ grid-template-columns:1fr; }
  :root{ --c-section-pad-y:var(--g-sp-8); }   /* reduce C-side vertical rhythm */
}


/* ===== English Grammar Test — token-only styles ===== */
:root{
  --u-subj:#0aa2c0; --u-verb:#e5484d; --u-obj:#2aa745; --u-other:#e8a13a; --u-conj:var(--s-brand);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--s-bg);color:var(--s-text);
  font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;
}
.app{max-width:var(--c-container-read,860px);margin:0 auto;padding:var(--g-sp-4,16px)}
@media(min-width:900px){.app{max-width:960px}}

/* appbar */
.appbar{position:sticky;top:0;z-index:20;background:var(--s-bg);
  padding:var(--g-sp-3,12px) 0 var(--g-sp-2,8px);border-bottom:1px solid var(--s-border);
  display:flex;flex-direction:column;gap:var(--g-sp-2,8px)}
.appbar__row{display:flex;align-items:center;gap:var(--g-sp-2,8px);flex-wrap:wrap}
.brandmark{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px}
.brandmark .ic{width:22px;height:22px;color:var(--s-brand)}
.sub{color:var(--s-text-muted);font-size:12.5px;line-height:1.5}
.spacer{flex:1}

/* segmented + icon buttons */
.seg{display:inline-flex;background:var(--s-brand-subtle,#eef);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--s-text-secondary);
  font:inherit;font-size:13px;padding:5px 11px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--s-bg);color:var(--s-brand);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.iconbtn{border:1px solid var(--s-border);background:var(--s-bg);color:var(--s-text-secondary);
  width:36px;height:34px;border-radius:9px;cursor:pointer;display:inline-grid;place-items:center}
.iconbtn .ic{width:18px;height:18px}
.iconbtn:hover{border-color:var(--s-brand);color:var(--s-brand)}

/* global icon default — prevents any un-sized .ic from ballooning */
svg.ic{width:1em;height:1em;flex:none;vertical-align:-.15em;display:inline-block}

/* mode tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--s-border);background:var(--s-bg);color:var(--s-text-secondary);
  padding:7px 14px;border-radius:999px;font-size:13.5px;cursor:pointer;font-weight:600;
  display:inline-flex;align-items:center;gap:6px}
.tab .ic{width:15px;height:15px}
.tab.on{background:var(--s-brand);color:var(--s-text-on-fill,#fff);border-color:var(--s-brand)}

/* category chips (filter) */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:var(--g-sp-3,12px) 0}
.chip{border:1px solid var(--s-border);background:var(--s-bg);color:var(--s-text-secondary);
  padding:5px 12px;border-radius:999px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.chip .ic{width:14px;height:14px}
.chip.on{background:var(--s-brand-subtle);color:var(--s-brand);border-color:var(--s-brand)}
.chip .cnt{opacity:.7;font-size:11px}

/* exam header */
.exam-head{border:1px dashed var(--s-border-strong,#bbb);border-radius:12px;
  padding:var(--g-sp-3,12px) var(--g-sp-4,16px);margin:var(--g-sp-3,12px) 0;
  display:flex;gap:var(--g-sp-4,16px);flex-wrap:wrap;align-items:center;background:var(--s-brand-subtle-2,transparent)}
.exam-head .f{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--s-text-secondary)}
.exam-head .line{display:inline-block;min-width:80px;border-bottom:1.5px solid var(--s-border-strong,#999)}
.exam-head .score{margin-left:auto;font-weight:800;color:var(--s-brand);font-size:15px}

/* question card */
.q{border:1px solid var(--s-border);border-radius:12px;padding:var(--g-sp-3,14px);
  margin-bottom:var(--g-sp-3,12px);background:var(--s-bg)}
.q__top{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.q__no{flex:0 0 auto;width:30px;height:30px;border-radius:8px;background:var(--s-brand-subtle);
  color:var(--s-brand);font-weight:800;display:grid;place-items:center;font-size:13px}
.q__cat{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--s-border);
  color:var(--s-text-muted);display:inline-flex;align-items:center;gap:4px}
.q__cat .ic{width:12px;height:12px}
.q__stem{font-size:16px;line-height:1.7;font-weight:600;letter-spacing:.2px}
.q__zh{color:var(--s-text-muted);font-size:13px;margin:4px 0 10px}
.blank{color:var(--s-brand);font-weight:800;border-bottom:2px solid var(--s-brand);padding:0 14px}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{border:1px solid var(--s-border);background:var(--s-bg);border-radius:10px;
  padding:9px 12px;font-size:14.5px;cursor:pointer;text-align:left;display:flex;gap:8px;align-items:center;color:var(--s-text)}
.opt .lab{flex:0 0 auto;width:20px;height:20px;border-radius:6px;background:var(--s-brand-subtle);
  color:var(--s-brand);font-weight:700;font-size:12px;display:grid;place-items:center}
.opt:hover{border-color:var(--s-brand)}
.opt.correct{border-color:var(--u-obj);background:color-mix(in srgb,var(--u-obj) 12%,transparent)}
.opt.correct .lab{background:var(--u-obj);color:#fff}
.opt.wrong{border-color:var(--u-verb);background:color-mix(in srgb,var(--u-verb) 12%,transparent)}
.opt.wrong .lab{background:var(--u-verb);color:#fff}
.opt.picked{border-color:var(--s-brand);background:var(--s-brand-subtle)}
.opt.picked .lab{background:var(--s-brand);color:var(--s-text-on-fill,#fff)}

/* exam (试卷) submit bar + result summary */
.exam-bar{margin-bottom:10px;flex-wrap:wrap;gap:8px;align-items:center;
  position:sticky;top:0;z-index:15;background:var(--s-bg);padding:8px 0}
.exam-result{border:1px solid var(--s-border);border-radius:14px;padding:16px;margin-bottom:14px;
  background:color-mix(in srgb,var(--s-brand) 8%,var(--s-surface))}
.exam-result__hd{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--s-text-secondary)}
.exam-result__hd>.ic{width:38px;height:38px;color:var(--s-brand);flex:none}
.exam-result__hd .big{font-size:32px;font-weight:900;color:var(--s-brand)}
.exam-result__pct{margin-left:8px;font-size:13px}
.exam-result__tip{margin:10px 0;font-size:13px;color:var(--s-text-secondary);line-height:1.6}

.q__act{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--s-border);background:var(--s-bg);color:var(--s-text-secondary);
  border-radius:9px;padding:6px 12px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:600}
.btn .ic{width:15px;height:15px}
.btn:hover{border-color:var(--s-brand);color:var(--s-brand)}
.btn--primary{background:var(--s-brand);color:var(--s-text-on-fill,#fff);border-color:var(--s-brand)}
.btn--primary:hover{color:#fff;filter:brightness(1.05)}

.reveal{margin-top:10px;border-top:1px dashed var(--s-border);padding-top:10px;display:none}
.reveal.show{display:block}
.reveal .ans{font-size:14px;font-weight:700;color:var(--u-obj);display:flex;align-items:center;gap:6px}
.reveal .ans .ic{width:15px;height:15px}
.reveal .full{margin:8px 0 4px;font-size:15px;line-height:1.7}
.reveal .full b{color:var(--s-brand);text-decoration:underline}
.reveal .ipa{color:var(--s-text-muted);font-size:12.5px;font-style:italic}
.reveal .why{margin-top:6px;font-size:12.5px;color:var(--s-text-secondary);background:var(--s-brand-subtle-2,var(--s-brand-subtle));
  border-radius:8px;padding:7px 10px;line-height:1.6}
.playbtn{border:1px solid var(--s-border);background:var(--s-bg);color:var(--s-brand);
  width:28px;height:28px;border-radius:8px;cursor:pointer;display:inline-grid;place-items:center;vertical-align:middle}
.playbtn .ic{width:15px;height:15px}
.playbtn.playing{background:var(--s-brand);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}

/* quiz mode */
.quizwrap{max-width:640px;margin:0 auto}
.progress{height:8px;border-radius:999px;background:var(--s-brand-subtle);overflow:hidden;margin:12px 0}
.progress i{display:block;height:100%;background:var(--s-brand);transition:width .3s}
.metrics{display:flex;gap:14px;font-size:13px;color:var(--s-text-secondary);align-items:center;flex-wrap:wrap}
.metrics b{color:var(--s-brand)}
.combo{color:var(--u-other);font-weight:800}
.done{text-align:center;padding:40px 16px}
.done .big{font-size:34px;font-weight:900;color:var(--s-brand)}
.done .ic{width:52px;height:52px;color:var(--s-brand)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px;border-radius:999px;
  background:color-mix(in srgb,var(--u-other) 18%,transparent);color:var(--u-other);font-weight:700}
.empty{text-align:center;padding:44px 16px;color:var(--s-text-muted)}
.empty .ic{width:46px;height:46px;color:var(--u-obj)}

/* ---- intelligent report ---- */
.report{display:flex;flex-direction:column;gap:16px}
.rp-hero{text-align:center;padding:24px 16px;border-radius:16px;
  background:color-mix(in srgb,var(--s-brand) 8%,var(--s-surface));border:1px solid var(--s-border)}
.rp-hero>.ic{width:44px;height:44px;color:var(--s-brand)}
.rp-score{font-size:16px;color:var(--s-text-secondary);margin-top:4px}
.rp-score .big{font-size:38px;font-weight:900;color:var(--s-brand)}
.rp-meta{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:14px;color:var(--s-text-secondary)}
.rp-meta b{color:var(--s-brand)}
.rp-meta .tag{font-size:11px;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--u-other) 18%,transparent);color:var(--u-other);font-weight:700}
.lvl{font-weight:800;font-size:14px;padding:3px 12px;border-radius:999px}
.lvl-a{background:color-mix(in srgb,var(--u-obj) 20%,transparent);color:var(--u-obj)}
.lvl-b{background:color-mix(in srgb,var(--u-subj) 20%,transparent);color:var(--u-subj)}
.lvl-c{background:color-mix(in srgb,var(--u-other) 20%,transparent);color:var(--u-other)}
.lvl-d{background:color-mix(in srgb,var(--u-verb) 20%,transparent);color:var(--u-verb)}
.rp-tip{margin:10px 0 0;font-size:13px;color:var(--s-text-secondary)}
.rp-sec{border:1px solid var(--s-border);border-radius:14px;padding:14px 16px;background:var(--s-surface)}
.rp-sec h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:6px;color:var(--s-text)}
.rp-sec h3 .ic{width:18px;height:18px;color:var(--s-brand)}

.kpbars{display:flex;flex-direction:column;gap:10px}
.kpbar__hd{display:flex;justify-content:space-between;font-size:13px;color:var(--s-text-secondary);margin-bottom:4px}
.kpbar__hd .ic{width:14px;height:14px;vertical-align:-2px}
.kpbar__n{font-weight:700;color:var(--s-text)}
.kpbar__track{height:8px;border-radius:999px;background:color-mix(in srgb,var(--s-border) 60%,transparent);overflow:hidden}
.kpbar__track i{display:block;height:100%;border-radius:999px;transition:width .4s}
.kpbar__track i.good{background:var(--u-obj)}
.kpbar__track i.mid{background:var(--u-other)}
.kpbar__track i.bad{background:var(--u-verb)}

.improve{display:flex;flex-direction:column;gap:10px}
.imp{border-left:3px solid var(--u-verb);padding:6px 12px;background:color-mix(in srgb,var(--u-verb) 6%,transparent);border-radius:0 8px 8px 0}
.imp__hd{font-size:14px}
.imp__n{font-size:12px;color:var(--s-text-muted);font-weight:600;margin-left:6px}
.imp__tip{font-size:13px;color:var(--s-text-secondary);margin-top:4px;line-height:1.5}
.allright{display:flex;align-items:center;gap:8px;color:var(--u-obj);font-weight:700;font-size:14px}
.allright .ic{width:20px;height:20px}

.wgrp{margin-bottom:12px}
.wgrp__hd{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px;margin-bottom:8px;color:var(--s-text)}
.wgrp__hd .ic{width:16px;height:16px;color:var(--s-brand)}
.wgrp__n{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--u-verb) 16%,transparent);color:var(--u-verb)}
.wq{border:1px solid var(--s-border);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--s-bg)}
.wq__stem{font-size:14px;font-weight:600;color:var(--s-text)}
.wq__zh{font-size:12px;color:var(--s-text-muted);margin:2px 0 6px}
.wq__lines{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.wq__bad{color:var(--u-verb)}
.wq__good{color:var(--u-obj);font-weight:700}
.wq__lines .ic{width:13px;height:13px;vertical-align:-2px}
.wq__full{font-size:13px;margin-top:6px;color:var(--s-text);display:flex;align-items:center;gap:6px}

.advice{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.advice li{font-size:13px;color:var(--s-text-secondary);line-height:1.5}
.advice b{color:var(--s-brand)}

.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--s-text-muted);margin:8px 0}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:16px;height:3px;border-radius:2px;display:inline-block}

/* print */
@media print{
  .appbar,.chips,.tabs,.q__act,.playbtn,.iconbtn,.seg,.no-print{display:none!important}
  .app{max-width:100%}
  .q{break-inside:avoid;border-color:#ccc}
  .reveal{display:block!important}
  body{background:#fff;color:#000}
}

</style>
</head>

  try {
    if (!('speechSynthesis' in window)) { if(btnEl) btnEl.classList.remove('playing'); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = _bestVoice || _pickVoice();
    if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'en-US'; }
    u.rate = (RATE_LEVELS[_rate] || RATE_LEVELS.normal).local; u.pitch = 1.0; u.volume = 0.6;
    if (btnEl) { u.onend = () => btnEl.classList.remove('playing'); u.onerror = () => btnEl.classList.remove('playing'); }
    window.speechSynthesis.speak(u);
  } catch (e) { if(btnEl) btnEl.classList.remove('playing'); }
}

// ================= helpers =================
function ico(id){ return html`<svg class="ic" aria-hidden="true"><use href="#${id}"></use></svg>`; }
const LETTER = ['A','B','C','D','E'];

// per-category study advice (common mistakes + how to fix)
const KP_TIPS = {
  tense: '看时间词判断时态:now/look 用现在进行(is/are+ing);yesterday/last… 用过去式;every day/usually 用一般现在。',
  third: '主语是 he/she/it 或单数名词时,动词要加 -s/-es;记住 do→does、have→has、go→goes。',
  prep: '记牢地点/时间搭配:in the morning、on Monday、at 7 o\'clock、in+大地点、at+小地点。',
  verb: '注意动词的正确形式与拼写:go/goes/went/going,别把不规则动词按规则加 -ed。',
  coll: '固定搭配要整体记忆,如 listen to、look at、good at、be interested in,不能自己换介词。',
  noun: '注意可数名词单复数与不规则变化:child→children、foot→feet、-y→-ies、-o→-oes。',
  adj: '形容词修饰名词、放在 be 动词后;注意与副词区分(quick→quickly),比较级 -er/more。'
};
function levelOf(pct){
  if(pct>=90) return {label:'优秀',cls:'lvl-a',tip:'非常棒!继续保持,可以挑战更难的题目。'};
  if(pct>=75) return {label:'良好',cls:'lvl-b',tip:'基础扎实,把错题弄懂就能更上一层楼。'};
  if(pct>=60) return {label:'及格',cls:'lvl-c',tip:'再多练几遍错题,重点巩固薄弱知识点。'};
  return {label:'加油',cls:'lvl-d',tip:'别灰心,先从错题本一题题复习,慢慢就会了。'};
}

// build full sentence by filling the blank with the answer
function fillSentence(q){
  return q.q.replace(/_{2,}|___/g, q.answer);
}
// per-sentence IPA from IPA_DICT
function sentenceIPA(sentence){
  const dict = window.IPA_DICT || {};
  const words = String(sentence).split(/\s+/).map(t=>{
    const c = t.toLowerCase().replace(/[.,!?;:"'()\/]/g,'').replace(/'s$/,'');
    if(!c || !/[a-z]/.test(c)) return '';
    const ip = dict[c]; return ip ? ip.replace(/^\/|\/$/g,'') : c;
  }).filter(Boolean);
  return '/' + words.join(' ') + '/';
}

// ================= component =================
class EtestApp extends LitElement {
  createRenderRoot(){ return this; }
  static get properties(){ return {
    mode:{state:true}, cat:{state:true}, showAll:{state:true}, rate:{state:true},
    _tick:{state:true}, quizMode:{state:true}, qIndex:{state:true}, qPicked:{state:true},
    qAnswered:{state:true}, qScore:{state:true}, combo:{state:true}, wrongN:{state:true},
    examSubmitted:{state:true}, _examTick:{state:true}
  };}
  constructor(){
    super();
    this.data = window.ETEST_DATA;
    this.mode = 'practice';      // 'practice' | 'quiz'
    this.cat = 'all';
    this.showAll = false;
    this.rate = 'normal';
    this._tick = 0;
    this.revealed = new Set();   // question ids revealed in practice
    // exam (试卷) state — answers hidden until submitted
    this.examPick = this._loadPick();   // { [q.id]: chosenOption } — 本地缓存,刷新不丢
    this.examSubmitted = false;
    this._examTick = 0;
    // quiz state
    this.quizMode = 'all';       // 'all' | 'review'
    this.wrong = this._loadWrong();
    this.wrongN = this.wrong.size;
    this._buildQuiz();
  }
  firstUpdated(){
    this.updateComplete.then(()=>{
      const b=document.getElementById('boot'); if(b) b.remove();
      try{
        const list = this.data.questions.map(q=>fillSentence(q));
        window.__allSentences = list;
        if(typeof _connect==='function') _connect();
        if(typeof _prewarm==='function') _prewarm(list);
      }catch(e){}
    });
  }

  // ---- wrong book ----
  _key(q){ return 'q'+q.id; }
  _loadWrong(){ try{ return new Set(JSON.parse(localStorage.getItem('etest_wrong')||'[]')); }catch(e){ return new Set(); } }
  _saveWrong(){ try{ localStorage.setItem('etest_wrong', JSON.stringify([...this.wrong])); }catch(e){} this.wrongN=this.wrong.size; }
  // ---- 作答本地缓存(交卷/提交前实时保存,交卷或重新作答后清空)----
  _loadPick(){ try{ return JSON.parse(localStorage.getItem('etest_progress')||'{}')||{}; }catch(e){ return {}; } }
  _savePick(){ try{ localStorage.setItem('etest_progress', JSON.stringify(this.examPick||{})); }catch(e){} }
  _clearPick(){ try{ localStorage.removeItem('etest_progress'); }catch(e){} }
  _wrongQuestions(){ return this.data.questions.filter(q=>this.wrong.has(this._key(q))); }
  clearWrong(){ this.wrong=new Set(); this._saveWrong(); if(this.mode==='quiz'&&this.quizMode==='review') this._buildQuiz(); this.requestUpdate(); }

  // ---- quiz building ----
  _buildQuiz(){
    const pool = this.quizMode==='review' ? this._wrongQuestions() : this.data.questions;
    const n = this.quizMode==='review' ? 9999 : 20;
    this._quiz = [...pool].sort(()=>Math.random()-0.5).slice(0,n)
      .map(q=>({ ...q, opts:[...q.options].sort(()=>Math.random()-0.5) }));
    this.qIndex=0; this.qPicked=-1; this.qAnswered=false; this.qScore=0; this.combo=0;
    this._results = [];   // {q, correct, picked}
  }
  startQuiz(m){ this.quizMode=m; this._buildQuiz(); this.mode='quiz'; this.requestUpdate(); }
  pickQ(i){
    if(this.qAnswered) return; this.qAnswered=true; this.qPicked=i;
    const q=this._quiz[this.qIndex], key=this._key(q), correct=q.opts[i]===q.answer;
    this._results.push({ q, correct, picked:q.opts[i] });
    if(correct){ this.qScore++; this.combo++;
      if(this.quizMode==='review' && this.wrong.has(key)){ const n=new Set(this.wrong); n.delete(key); this.wrong=n; this._saveWrong(); }
    } else { this.combo=0;
      if(!this.wrong.has(key)){ this.wrong=new Set([...this.wrong,key]); this._saveWrong(); } }
    speak(fillSentence(q));
    this.requestUpdate();
  }
  nextQ(){ if(this.qIndex<this._quiz.length-1){ this.qIndex++; this.qPicked=-1; this.qAnswered=false; } else { this.qIndex++; } this.requestUpdate(); }

  changeRate(r){ setRate(r); this.rate=r; }
  toggleTheme(){ const el=document.documentElement; el.setAttribute('data-theme', el.getAttribute('data-theme')==='dark'?'':'dark'); this._tick++; }
  revealQ(id){ this.revealed.add(id); this.requestUpdate(); }

  // ---- exam (试卷) flow: answers hidden until 交卷 ----
  pickExam(qid, option){
    if(this.examSubmitted) return;          // locked after submit
    this.examPick = { ...this.examPick, [qid]: option };
    this._savePick();                        // 每选一题就本地缓存,刷新/误关不丢
    this._examTick++;
    this.requestUpdate();
  }
  submitExam(){
    const list = this._filtered();
    // grade + collect wrongs into 错题本
    let wrong = new Set(this.wrong);
    list.forEach(q=>{
      const picked = this.examPick[q.id];
      if(picked !== q.answer){ wrong.add(this._key(q)); }
    });
    this.wrong = wrong; this._saveWrong();
    this.examSubmitted = true;
    this._clearPick();                       // 交卷后清空本地缓存的作答
    if(typeof window!=='undefined' && window.scrollTo) window.scrollTo(0,0);
    this.requestUpdate();
  }
  resetExam(){ this.examPick={}; this.examSubmitted=false; this._clearPick(); this._examTick++; if(window.scrollTo) window.scrollTo(0,0); this.requestUpdate(); }
  _examScore(list){ return list.reduce((n,q)=>n+(this.examPick[q.id]===q.answer?1:0),0); }

  _filtered(){ return this.cat==='all' ? this.data.questions : this.data.questions.filter(q=>q.cat===this.cat); }

  // ---- renders ----
  render(){
    return html`
    <div class="app">
      ${this._appbar()}
      ${this.mode==='practice' ? this._practice() : this._quizView()}
    </div>`;
  }

  _appbar(){
    const cats = Object.keys(this.data.catLabel);
    return html`
    <div class="appbar">
      <div class="appbar__row">
        <div class="brandmark">${ico('ic-graduation')} 英语综合语法测试</div>
        <div class="spacer"></div>
        <div class="seg">
          ${['slow','normal','fast'].map(r=>html`
            <button class="${this.rate===r?'on':''}" @click=${()=>this.changeRate(r)}>${RATE_LEVELS[r].label}</button>`)}
        </div>
        <button class="iconbtn" title="打印/导出" @click=${()=>window.print()}>${ico('ic-clipboard-check')}</button>
        <button class="iconbtn" title="深色模式" @click=${()=>this.toggleTheme()}>${ico('ic-moon')}</button>
      </div>
      <div class="sub">${this.data.sub}</div>
      <div class="tabs">
        <button class="tab ${this.mode==='practice'?'on':''}" @click=${()=>{this.mode='practice';}}>${ico('ic-list')} 试卷 · 150 题</button>
        <button class="tab ${this.mode==='quiz'&&this.quizMode==='all'?'on':''}" @click=${()=>this.startQuiz('all')}>${ico('ic-target')} 闯关练习</button>
        <button class="tab ${this.mode==='quiz'&&this.quizMode==='review'?'on':''}" @click=${()=>this.startQuiz('review')}>
          ${ico('ic-refresh')} 错题本 ${this.wrongN?html`<span class="badge">${this.wrongN}</span>`:''}
        </button>
      </div>
      ${this.mode==='practice'?html`
      <div class="chips">
        <button class="chip ${this.cat==='all'?'on':''}" @click=${()=>{this.cat='all';this.resetExam();}}>全部 <span class="cnt">${this.data.questions.length}</span></button>
        ${cats.map(c=>html`
          <button class="chip ${this.cat===c?'on':''}" @click=${()=>{this.cat=c;this.resetExam();}}>
            ${ico(this.data.catIcon[c])} ${this.data.catLabel[c]}
            <span class="cnt">${this.data.questions.filter(q=>q.cat===c).length}</span>
          </button>`)}
      </div>`:''}
    </div>`;
  }

  _practice(){
    const list=this._filtered();
    const answered = list.filter(q=>this.examPick[q.id]!=null).length;
    const total = list.length;
    const score = this.examSubmitted ? this._examScore(list) : null;

    const lv = this.examSubmitted ? levelOf(pct) : null;
    return html`
      <div class="exam-head no-print-hide">
        <span class="f">姓名 <b class="line"></b></span>
        <span class="f">班级 <b class="line"></b></span>
        <span class="f">日期 <b class="line"></b></span>
        <span class="score">得分 ${this.examSubmitted?score:'______'} / ${total}</span>
      </div>
      ${this.examSubmitted?html`
        <div class="exam-result">
          <div class="exam-result__hd">
            ${ico('ic-trophy')}
            <div><span class="big">${score}</span> / ${total} 分
              <span class="lvl ${lv.cls}">${lv.label}</span>
              <span class="exam-result__pct">正确率 ${pct}%</span>
            </div>
          </div>
          <p class="exam-result__tip">${lv.tip}下方每题已标出正误、正确答案、完整句子与讲解。答错的题已自动收进错题本。</p>
          <div class="q__act">
            <button class="btn btn--primary" @click=${()=>this.resetExam()}>${ico('ic-refresh')} 重新作答</button>
            ${this.wrongN?html`<button class="btn" @click=${()=>this.startQuiz('review')}>${ico('ic-refresh')} 去错题本巩固(${this.wrongN})</button>`:''}
            <button class="btn" @click=${()=>window.print()}>${ico('ic-clipboard-check')} 打印/导出</button>
          </div>
        </div>`:html`
        <div class="appbar__row exam-bar no-print">
          <span class="sub">依次作答,完成后点「交卷」查看成绩与讲解。作答前不显示答案。</span>
          <span class="spacer"></span>
          <span class="sub">已答 <b>${answered}</b> / ${total}</span>
          <button class="btn btn--primary" @click=${()=>this.submitExam()}>${ico('ic-clipboard-check')} 交卷</button>
        </div>`}
      ${list.map((q,i)=>this._qcard(q,i+1))}
      ${!this.examSubmitted?html`
        <div class="appbar__row" style="margin:16px 0;justify-content:center">
          <button class="btn btn--primary" @click=${()=>this.submitExam()}>${ico('ic-clipboard-check')} 交卷 · 查看成绩(已答 ${answered}/${total})</button>
        </div>`:''}
    `;
  }

  _qcard(q,seq){
    const submitted = this.examSubmitted;
    const picked = this.examPick[q.id];
    const full = fillSentence(q);
    const stem = q.q.split(/_{2,}|___/);
    return html`
    <div class="q">
      <div class="q__top">
        <span class="q__no">${seq}</span>
        <div style="flex:1">
          <span class="q__cat">${ico(this.data.catIcon[q.cat])} ${this.data.catLabel[q.cat]}</span>
          <div class="q__stem">${stem[0]}<span class="blank"></span>${stem[1]||''}</div>
          <div class="q__zh">${q.zh}</div>
        </div>
      </div>
      <div class="opts">
        ${q.options.map((o,oi)=>{
          let cls='opt';
          if(submitted){
            if(o===q.answer) cls+=' correct';
            else if(o===picked) cls+=' wrong';
          } else if(o===picked){ cls+=' picked'; }
          return html`<div class="${cls}" @click=${()=>this.pickExam(q.id,o)}><span class="lab">${LETTER[oi]}</span>${o}</div>`;
        })}
      </div>
      ${submitted?html`
      <div class="reveal show">

        <div class="full">完整句子:<b>${full}</b>
          <button class="playbtn" @click=${e=>speak(full,e.currentTarget)}>${ico('ic-volume')}</button>
        </div>
        <div class="ipa">${sentenceIPA(full)}</div>
        <div class="why">${ico('ic-info')} ${q.why}</div>
      </div>`:''}
    </div>`;
  }

  _quizView(){
    const total=this._quiz.length;
    if(this.quizMode==='review' && total===0){
      return html`<div class="quizwrap"><div class="empty">
        ${ico('ic-check')}<h3>错题本是空的 🎉</h3>
        <p>去「闯关练习」做题,答错的题会自动收进错题本。</p>
        <button class="btn btn--primary" @click=${()=>this.startQuiz('all')}>${ico('ic-target')} 开始闯关</button>

      return this._report(total);

    const q=this._quiz[this.qIndex];
    const full=fillSentence(q);
    const stem=q.q.split(/_{2,}|___/);
    return html`<div class="quizwrap">

        <span>第 <b>${this.qIndex+1}</b> / ${total} 题</span>

            return html`<div class="${cls}" @click=${()=>this.pickQ(i)}><span class="lab">${LETTER[i]}</span>${o}</div>`;

  // ---- intelligent post-quiz report ----
  _report(total){
    const pct = total?Math.round(this.qScore/total*100):0;
    const lv = levelOf(pct);
    const res = this._results || [];
    const wrongs = res.filter(r=>!r.correct);
    // per-category stats
    const cats = {};
    res.forEach(r=>{ const c=r.q.cat; (cats[c]=cats[c]||{t:0,ok:0}).t++; if(r.correct) cats[c].ok++; });
    const catRows = Object.keys(cats).map(c=>{
      const s=cats[c], p=Math.round(s.ok/s.t*100);
      return { c, t:s.t, ok:s.ok, wrong:s.t-s.ok, p };
    }).sort((a,b)=>a.p-b.p);
    // weak points: categories with wrong answers (worst first)
    const weak = catRows.filter(r=>r.wrong>0);
    // group wrong questions by category
    const wrongByCat = {};
    wrongs.forEach(r=>{ (wrongByCat[r.q.cat]=wrongByCat[r.q.cat]||[]).push(r); });
    const grpKeys = Object.keys(wrongByCat).sort((a,b)=>wrongByCat[b].length-wrongByCat[a].length);

    return html`<div class="quizwrap">
      <div class="report">

        </div>

        <div class="rp-sec">
          <h3>${ico('ic-target')} 知识点掌握情况</h3>

            ${catRows.map(r=>html`
              <div class="kpbar">
                <div class="kpbar__hd">
                  <span>${ico(this.data.catIcon[r.c])} ${this.data.catLabel[r.c]}</span>
                  <span class="kpbar__n">${r.ok}/${r.t} · ${r.p}%</span>
                </div>
                <div class="kpbar__track"><i class="${r.p>=80?'good':r.p>=60?'mid':'bad'}" style="width:${r.p}%"></i></div>
              </div>`)}
          </div>
        </div>

        ${weak.length?html`
        <div class="rp-sec">
          <h3>${ico('ic-info')} 待改进项</h3>
          <div class="improve">
            ${weak.map(r=>html`
              <div class="imp">
                <div class="imp__hd"><b>${this.data.catLabel[r.c]}</b> <span class="imp__n">错 ${r.wrong} 题 · 正确率 ${r.p}%</span></div>
                <div class="imp__tip">${KP_TIPS[r.c]||''}</div>
              </div>`)}
          </div>
        </div>`:html`
        <div class="rp-sec">
          <div class="allright">${ico('ic-check')} 全部答对,太棒了!没有需要改进的知识点。</div>
        </div>`}

        ${wrongs.length?html`
        <div class="rp-sec">
          <h3>${ico('ic-list')} 错题回顾(共 ${wrongs.length} 题)</h3>
          ${grpKeys.map(c=>html`
            <div class="wgrp">
              <div class="wgrp__hd">${ico(this.data.catIcon[c])} ${this.data.catLabel[c]}<span class="wgrp__n">${wrongByCat[c].length}</span></div>
              ${wrongByCat[c].map(r=>{
                const full=fillSentence(r.q);
                return html`
                <div class="wq">
                  <div class="wq__stem">${r.q.q.replace(/_{2,}|___/g,'____')}</div>
                  <div class="wq__zh">${r.q.zh}</div>
                  <div class="wq__lines">
                    <span class="wq__bad">${ico('ic-info')} 你选:${r.picked}</span>
                    <span class="wq__good">${ico('ic-check')} 正确:${r.q.answer}</span>
                  </div>
                  <div class="wq__full">${full}
                    <button class="playbtn" @click=${e=>speak(full,e.currentTarget)}>${ico('ic-volume')}</button>
                  </div>
                  <div class="ipa">${sentenceIPA(full)}</div>
                  <div class="why">${r.q.why}</div>
                </div>`;
              })}
            </div>`)}
        </div>`:''}

        <div class="rp-sec">
          <h3>${ico('ic-star')} 学习建议</h3>
          <ul class="advice">
            ${weak.length?weak.map(r=>html`<li>重点复习 <b>${this.data.catLabel[r.c]}</b>:${KP_TIPS[r.c]||''}</li>`)
                          :html`<li>保持优势,尝试给爸爸妈妈讲一讲每道题为什么这样选。</li>`}
            <li>错题已自动收进「错题本」,点下方按钮随时巩固,答对后会自动移出。</li>
            <li>朗读完整句子并跟读音标,把语法记在真实句子里更牢固。</li>
          </ul>
        </div>

        <div class="metrics" style="justify-content:center;flex-wrap:wrap">
          ${this.wrongN?html`<button class="btn btn--primary" @click=${()=>this.startQuiz('review')}>${ico('ic-refresh')} 复习错题本(${this.wrongN})</button>`:''}
          <button class="btn" @click=${()=>this.startQuiz(this.quizMode)}>${ico('ic-target')} 再来一组</button>
          <button class="btn" @click=${()=>{this.mode='practice';}}>${ico('ic-list')} 返回试卷</button>
        </div>
      </div>
    </div>`;
  }
}
customElements.define('etest-app', EtestApp);

</script>
</body>
</html>
