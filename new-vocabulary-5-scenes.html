  for (let i=0;i<words.length;i++){
    const w = clean[i];
    if (i < verbIdx){ roles[i] = _CONJ.has(w) ? 'other' : 'subj'; }
    else if (i === verbIdx){ roles[i]='verb'; }
    else {
      const prevVerb = roles[i-1]==='verb';
      // 情态/助动词后面紧跟的实义动词、连续的动词、-ing 分词 → 仍是谓语
      if (prevVerb && (_VERBS.has(w) || _AUX.has(w) || /ing$/.test(w) || (_MODAL.has(clean[i-1])))){
        roles[i]='verb';
      }
      else if (_PREP.has(w) || _CONJ.has(w)){ roles[i]='other'; }   // 介词短语/连词 → 状语
      else if (_ADV.has(w)){ roles[i]='other'; }                    // 副词(high/fast/very…) → 状语
      else if (isBeSentence){ roles[i]='obj'; }                     // be 句里非副词的词 = 表语(记作宾)
      else if (_ADV.has(clean[i-1])){ roles[i]='other'; }           // 副词后接的词跟随状语(如 run very fast)
      else if (roles[i-1]==='other'){ roles[i]='other'; }           // 跟在状语后面继续算状语
      else { roles[i]='obj'; }                                      // 实义动词的宾语
    }
  }
  // map back to full token stream (words + spaces), assign role per word token
  let wi = 0;
  return tokens.map(t => /^\s+$/.test(t) ? {text:t, role:null} : {text:t, role: roles[wi++]});
}

// render a colorized sentence as Lit template
// 句子表示:下划线 + 关键词标识组合
// 把连续同成分的词合成短语,整段用彩色下划线,并在下方标注成分名(主/谓/宾/状)。
const _ROLE_SHORT = { subj:'主语', verb:'谓语', obj:'宾语', other:'状语', s:'主语', v:'谓语', o:'宾语', a:'状语' };
const _ROLE_MAP = { s:'subj', v:'verb', o:'obj', a:'other' };
function colorSentence(sentence){
  // 优先使用人工校对的标注(保证 100% 正确);没有再退回自动解析。
  const ann = (typeof window!=='undefined' && window.SENT_ANN) ? window.SENT_ANN[sentence] : null;
  if (ann){
    // 计算末尾标点(标注文本不含句末标点),补到最后一段
    const joined = ann.map(p=>p[1]).join(' ');
    let tail = '';
    const rest = sentence.slice(joined.length);
    if (/^[.?!,]+/.test(rest.trimStart())) tail = rest.trim();
    return html`<span class="sent-underline">${ann.map((p,i) => {
      const role = _ROLE_MAP[p[0]] || p[0];
      const isLast = i===ann.length-1;
      return html`<span class="tk-u tk-u--${role}"><span class="tk-u__word">${p[1]}${isLast&&tail?tail:''}</span><span class="tk-u__tag">${_ROLE_SHORT[p[0]]||''}</span></span>${isLast?'':' '}`;
    })}</span>`;
  }
  const parts = tokenizeParts(sentence);
  const groups = [];
  parts.forEach(p => {
    if (p.role === null) { if (groups.length) groups[groups.length-1].text += p.text; return; }
    const last = groups[groups.length-1];
    if (last && last.role === p.role) last.text += p.text;
    else groups.push({ role: p.role, text: p.text });
  });
  return html`<span class="sent-underline">${groups.map(g => html`<span class="tk-u tk-u--${g.role}"><span class="tk-u__word">${g.text.trimEnd()}</span><span class="tk-u__tag">${_ROLE_SHORT[g.role]||''}</span></span>${/\s$/.test(g.text)?' ':''}`)}</span>`;
}

// group consecutive same-role words into phrases (for structure readout)
function _phrases(sentence){
  const parts = tokenizeParts(sentence).filter(p=>p.role!==null);
  const groups=[];
  parts.forEach(p=>{
    const clean=p.text.replace(/[.,!?;:]/g,'');
    if(groups.length && groups[groups.length-1].role===p.role){ groups[groups.length-1].text+=' '+clean; }
    else groups.push({role:p.role, text:clean});
  });
  return groups;
}

// auto-generate a kid-friendly "why is the sentence built this way" reading
function explainSentence(sentence){
  // 优先用人工校对标注生成"成分公式",保证正确
  const ann = (typeof window!=='undefined' && window.SENT_ANN) ? window.SENT_ANN[sentence] : null;
  if (ann){
    const nm = { s:'主语', v:'谓语', o:'宾语', a:'状语' };
    // 判断 be 句 → 宾改为表语
    const isBe = ann.some(p=>p[0]==='v' && /^(am|is|are|was|were)$/i.test(p[1].trim()));
    const roleName = code => (code==='o' && isBe) ? '表语' : nm[code];
    const formula = ann.map(p=>`${roleName(p[0])}(${p[1]})`).join('  →  ');
    return { formula, note:'' };
  }
  const g = _phrases(sentence);
  const subj = g.find(x=>x.role==='subj');
  const verb = g.find(x=>x.role==='verb');
  const obj  = g.find(x=>x.role==='obj');
  const other= g.filter(x=>x.role==='other').map(x=>x.text).join(' / ');
  const isImperative = !subj && verb;
  const isBe = verb && _BE.has(verb.text.toLowerCase().split(' ')[0]);
  const roleName = (r)=>({subj:'主语',verb:'谓语',obj:(isBe?'表语':'宾语'),other:'状语'}[r]);
  // word-mapped formula: 主语(She) → 谓语(likes) → 宾语(bread)
  const formula = g.map(x=>`${roleName(x.role)}(${x.text})`).join('  →  ');
  let note='';
  if (isImperative){
    note = `这是祈使句(让别人做某事),不用主语,直接用动词「${verb.text}」开头` + (obj?`,后面接动作的对象「${obj.text}」`:'') + '。';
  } else if (isBe){
    note = `用 be 动词「${verb.text}」把主语「${subj?subj.text:''}」和「${obj?obj.text:other}」连起来,意思是“……是/怎么样”。`;
  } else {
    note = `先说“谁”→ 主语「${subj?subj.text:'?'}」,再说“做什么”→ 动词「${verb?verb.text:'?'}」` + (obj?`,再说动作的对象 → 宾语「${obj.text}」`:'') + '。';
  }
  if (other) note += ` 结尾的「${other}」是状语(地点/时间等),英语习惯放句子后面,和中文语序不同。`;
  return { formula, note };
}

function sentenceIPA(sentence){
  const dict = window.IPA_DICT || {};
  const words = sentence.split(/\s+/).filter(Boolean);
  const parts = words.map(w => {
    const clean = w.toLowerCase().replace(/[.,!?;:]/g,'');
    const ipa = dict[clean];
    return ipa ? ipa.replace(/^\/|\/$/g,'') : clean; // strip slashes, join later
  });
  return '/' + parts.join(' ') + '/';
}

  };
  createRenderRoot(){ return this; }
  constructor(){
    super();

    this.wrong = this._loadWrong();        // Set of 错词 key(= 单词英文)
    this._quiz = []; this._buildQuiz();
  }
  toggleTheme(){ const c=document.documentElement.getAttribute('data-theme'); document.documentElement.setAttribute('data-theme', c==='dark'?'':'dark'); this.requestUpdate(); }
  get isDark(){ return document.documentElement.getAttribute('data-theme')==='dark'; }
  setTab(t){ this.tab=t; this.activeScene=null; if(t==='quiz'){ this.quizMode='all'; this._buildQuiz(); } if(t==='review'){ this.quizMode='review'; this._buildQuiz(); } }
  openScene(id){ this.activeScene=id; window.scrollTo&&window.scrollTo(0,0); }

  // ---- 错题本(自动收藏 + 本地持久化)----
  _loadWrong(){ try{ const r=localStorage.getItem('nv_wrong'); return new Set(r?JSON.parse(r):[]); }catch(e){ return new Set(); } }
  _saveWrong(){ try{ localStorage.setItem('nv_wrong', JSON.stringify([...this.wrong])); }catch(e){} }
  _wrongQuestions(){
    // 用错词构造题目:每个错词取题库里以它为答案(say)的题
    const keys=this.wrong;
    return this.data.quiz.filter(q => keys.has(q.say));
  }

  _buildQuiz(){
    let pool;
    if(this.quizMode==='review'){ pool=this._wrongQuestions(); }
    else { pool=this.data.quiz; }
    this._quiz = [...pool].sort(()=>Math.random()-0.5).slice(0, this.quizMode==='review'?9999:25)
      .map(q=>({ ...q, opts:[...q.options].sort(()=>Math.random()-0.5) }));
    this.qIndex=0; this.qPicked=-1; this.qAnswered=false; this.qScore=0; this.combo=0;
  }
  pickQ(i){
    if(this.qAnswered) return;
    this.qAnswered=true; this.qPicked=i;
    const q=this._quiz[this.qIndex];
    const correct = q.opts[i]===q.answer;
    if(correct){
      this.qScore++; this.combo++;
      // 错题本模式下答对 → 自动移出错题本
      if(this.quizMode==='review' && this.wrong.has(q.say)){ const n=new Set(this.wrong); n.delete(q.say); this.wrong=n; this._saveWrong(); }
    } else {
      this.combo=0;
      // 答错 → 自动收藏进错题本
      if(!this.wrong.has(q.say)){ this.wrong=new Set([...this.wrong, q.say]); this._saveWrong(); }
    }
    speak(q.say);
  }
  nextQ(){ if(this.qIndex<this._quiz.length-1){ this.qIndex++; this.qPicked=-1; this.qAnswered=false; } else { this.qIndex=this._quiz.length; } }
  clearWrong(){ this.wrong=new Set(); this._saveWrong(); this._buildQuiz(); this.requestUpdate(); }

        <div class="quiz-progress"><span>第 ${this.qIndex+1} / ${this._quiz.length} 题</span>
          <span class="quiz-status">${this.combo>=2?html`<span class="combo">🔥 连对 ${this.combo}</span>`:''} 得分 ${this.qScore}</span></div>
        <div class="quiz-bar"><div class="quiz-bar__fill" style="width:${pct}%"></div></div>
        <div class="quiz-ask">
          <div class="quiz-ask__mode">${q.mode==='zh2en'?'看中文,选英文':q.mode==='en2zh'?'看英文,选中文':'读句子,选出填空的词(看它在句子里怎么用)'}</div>
          ${q.mode==='cloze' ? html`
            <div class="quiz-ask__cloze">${q.prompt}</div>
            <div class="quiz-ask__sub">${q.promptSub||''}</div>
          ` : html`
            <div class="quiz-ask__prompt">${q.prompt}
              ${q.mode==='en2zh'?html`<button class="speak speak--sm" title="朗读" @click=${(e)=>speak(q.say,e.currentTarget)}>${ico('ic-volume','ico--sm')}</button>`:''}
            </div>
            <div class="quiz-ask__sub">${q.promptSub||''}</div>
          `}
        </div>
        <div class="quiz-opts">
          ${q.opts.map((opt,i)=>{ let cls=''; if(this.qAnswered){ if(opt===q.answer)cls='correct'; else if(i===this.qPicked)cls='wrong'; }
            return html`<button class="quiz-opt ${cls}" ?disabled=${this.qAnswered} @click=${()=>this.pickQ(i)}>${opt}</button>`; })}
        </div>
        ${this.qAnswered?html`
          <div class="quiz-feedback">
            ${q.opts[this.qPicked]===q.answer?html`<span style="color:var(--g-green-700);font-weight:600">${ico('ic-check-circle-2','ico--sm')} 正确!${this.quizMode==='review'?html` <span class="fb-tag fb-tag--out">已移出错题本</span>`:''}</span>`:html`<span style="color:var(--g-red-700);font-weight:600">${ico('ic-x-circle','ico--sm')} 正确答案:${q.answer} <span class="fb-tag fb-tag--in">${ico('ic-repeat','ico--xs')} 已自动收藏</span></span>`}
            ${q.mode==='cloze' ? html`
              <div class="quiz-feedback__sent">${colorSentence(q.full)}
                <button class="speak speak--sm" title="朗读整句" @click=${(e)=>speak(q.full,e.currentTarget)}>${ico('ic-volume','ico--xs')}</button>
              </div>
              <span class="quiz-feedback__ipa">${sentenceIPA(q.full)}</span>
            ` : html`<span class="quiz-feedback__ipa">${q.ipa||''}</span>`}
          </div>
          <div class="quiz-next"><button class="btn btn--primary" @click=${()=>this.nextQ()}>${this.qIndex<this._quiz.length-1?'下一题':'查看结果'} ${ico('ic-arrow-right','ico--sm')}</button></div>
        `:''}
      </div>`;
  }

  _collectSentences(){
    const set=new Set();
    this.data.scenes.forEach(s=>{ s.words.forEach(w=>{set.add(w.en);if(w.example)set.add(w.example);}); (s.related||[]).forEach(r=>{set.add(r.en);if(r.example)set.add(r.example);}); });
    return [...set];
  }
  async firstUpdated(){
    await this.updateComplete;
    const b=document.getElementById('boot'); if(b) b.remove();
    try{ const list=this._collectSentences(); window.__allSentences=list; if(typeof _connect==='function')_connect(); if(typeof _prewarm==='function')_prewarm(list); }catch(e){}
  }
}
customElements.define('nv-app', NvApp);

</script>
</body>
</html>
